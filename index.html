function droppedForRun(code,run){const prev=prevRun(code,run);if(!prev)return[];const curr=new Set(recordsForRun(run.id).map(r=>r.symbol));const sm=symbolMap();return [...new Set(recordsForRun(prev.id).map(r=>r.symbol).filter(s=>!curr.has(s)))].map(s=>({symbol:s,name:(sm[s]||{}).name||s,prevRun:prev}))}

function currentUniverse(){const sm=symbolMap(), syms=new Set();Object.keys(state.registry).forEach(code=>{const lr=latestRun(code);if(lr)recordsForRun(lr.id).forEach(r=>syms.add(r.symbol))});Object.keys(state.registry).forEach(code=>{const lr=latestRun(code);if(!lr)return;droppedForRun(code,lr).forEach(d=>{const dec=state.dropDecisions[decisionKey(code,d.symbol,lr.id)];if(dec&&dec.action==='KEEP')syms.add(d.symbol)})});Object.keys(state.watchlists).forEach(s=>{if(state.watchlists[s])syms.add(s)});

 document.getElementById('importModal').classList.add('show');
 const now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 document.getElementById('importDialog').innerHTML=`<div class="dialog-head"><div><b>Scanner CSV Import Center</b><div class="muted" style="font-size:12px">Every scanner will resolve to exactly one state: CSV Result / Confirmed Zero / Not Run.</div></div><div class="spacer"></div><button class="btn small ghost" onclick="closeImport()">✕</button></div><div class="dialog-body"><div class="import-tabs"><button class="import-tab active" id="impTabInput" onclick="switchImportTab('input')">SCAN INPUT</button><button class="import-tab" id="impTabStatus" onclick="switchImportTab('status')">NOT RUN / RUN STATUS</button></div><div id="impPaneInput"><div class="import-grid"><div class="field"><label>Run Date</label><input id="impDate" type="date" value="${today}"></div><div class="field"><label>Weekly run</label><select id="impWeek"><option>MID-WEEK</option><option>WEEK CLOSE</option></select></div><div class="field"><label>Monthly / Cup run</label><select id="impMonth"><option>MID-MONTH</option><option>MONTH CLOSE</option></select></div></div><div class="import-zone"><input id="csvFiles" type="file" accept=".csv,text/csv" multiple><div class="muted" style="font-size:12px;margin-top:8px">Select multiple CSVs together. Example: 101 - ...csv, 204 - ...csv, 405 - ...csv</div></div><div style="height:10px"></div><div class="field"><label>Confirmed zero-result scanner codes</label><input id="zeroCodes" placeholder="e.g. 106, 107, 306"><div class="footer-note">Type a code only when that scanner was actually run and Chartink returned no result.</div></div><div id="impConflict"></div><div style="height:14px"></div><button class="btn primary" onclick="importCSVs()">Import Selected Runs</button></div><div id="impPaneStatus" style="display:none"><div id="importStatusBody"></div><div style="height:14px"></div><button class="btn primary" onclick="switchImportTab('input')">← Back to Scan Input</button></div></div>`;
 document.getElementById('csvFiles').addEventListener('change',refreshImportStatus);
 document.getElementById('zeroCodes').addEventListener('input',refreshImportStatus);
 refreshImportStatus();
}
function closeImport(){document.getElementById('importModal').classList.remove('show')}
function switchImportTab(tab){const input=tab==='input';document.getElementById('impPaneInput').style.display=input?'block':'none';document.getElementById('impPaneStatus').style.display=input?'none':'block';document.getElementById('impTabInput').classList.toggle('active',input);document.getElementById('impTabStatus').classList.toggle('active',!input);refreshImportStatus()}
function importDetectedCodes(){const el=document.getElementById('csvFiles');if(!el)return[];const out=[];for(const f of [...el.files]){const m=f.name.match(/(?:^|\D)(\d{3})(?:\D|$)/);if(m&&state.registry[m[1]]&&!out.includes(m[1]))out.push(m[1])}return out.sort()}
function importZeroCodes(){const el=document.getElementById('zeroCodes');return el?(el.value.match(/\d{3}/g)||[]).filter((c,i,a)=>state.registry[c]&&a.indexOf(c)===i).sort():[]}
function importStateSets(){const results=importDetectedCodes(),zeros=importZeroCodes(),conflicts=zeros.filter(c=>results.includes(c)),notRun=Object.keys(state.registry).sort().filter(c=>!results.includes(c)&&!zeros.includes(c));return{results,zeros,notRun,conflicts}}
function stateChips(codes,kind){if(!codes.length)return'<span class="muted" style="font-size:12px">None</span>';return codes.map(c=>`<label class="state-chip ${kind}">${kind==='notrun'?'<input type="checkbox" checked disabled>':''}<b>${c}</b><span>${esc(registry(c).family)}</span></label>`).join('')}
function refreshImportStatus(){const box=document.getElementById('importStatusBody');if(!box)return;const x=importStateSets();const conflict=document.getElementById('impConflict');if(conflict)conflict.innerHTML=x.conflicts.length?`<div class="conflict-note"><b>Conflict:</b> ${x.conflicts.join(', ')} ${x.conflicts.length===1?'is':'are'} present both as CSV and Confirmed Zero. Remove the code from Zero before importing.</div>`:'';box.innerHTML=`<div class="notice"><b>Automatic partition:</b> scanners without a CSV and not marked Zero are automatically <b>NOT RUN / PREVIOUS UNCHANGED</b>. You do not need to type them.</div><div class="run-summary"><span class="run-pill result">CSV RESULT ${x.results.length}</span><span class="run-pill zero">CONFIRMED ZERO ${x.zeros.length}</span><span class="run-pill notrun">NOT RUN ${x.notRun.length}</span></div><div class="scanner-state-group"><h4>CSV RESULT — will update</h4><div class="scanner-state-grid">${stateChips(x.results,'result')}</div></div><div class="scanner-state-group"><h4>CONFIRMED ZERO — will update to zero & may create DROPPED stocks</h4><div class="scanner-state-grid">${stateChips(x.zeros,'zero')}</div></div><div class="scanner-state-group"><h4>NOT RUN / PREVIOUS UNCHANGED — auto-selected</h4><div class="scanner-state-grid">${stateChips(x.notRun,'notrun')}</div></div>${x.conflicts.length?`<div class="conflict-note"><b>Import blocked until conflict is resolved:</b> ${x.conflicts.join(', ')}</div>`:''}`}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cell+=ch}if(cell.length||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row)}return rows}
function normHead(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
function idx(headers,preds){for(let i=0;i<headers.length;i++)if(preds.some(p=>p(headers[i])))return i;return -1}
function parseChartink(text){const rows=parseCSV(text);if(!rows.length)return[];const h=rows[0].map(normHead);const ix={name:idx(h,[x=>x.includes('stockname'),x=>x==='name']),symbol:idx(h,[x=>x==='symbol',x=>x.endsWith('symbol')]),close:idx(h,[x=>x==='close',x=>x==='price',x=>x.includes('closeprice')]),pct:idx(h,[x=>x.includes('change')||x.includes('chg')]),volume:idx(h,[x=>x.includes('volume')]),mRsi:idx(h,[x=>x.includes('monthly')&&x.includes('rsi'),x=>x==='mrsi']),wRsi:idx(h,[x=>x.includes('weekly')&&x.includes('rsi'),x=>x==='wrsi']),dRsi:idx(h,[x=>x==='rsi',x=>x.includes('daily')&&x.includes('rsi'),x=>x==='drsi'])};
 const n=v=>{if(v==null||v==='')return null;const z=Number(String(v).replace(/,/g,'').replace('%',''));return Number.isFinite(z)?z:null};return rows.slice(1).map(r=>({symbol:(r[ix.symbol]||'').trim().replace(/^NSE:/i,'').toUpperCase(),name:(r[ix.name]||'').trim(),close:n(r[ix.close]),pct:(()=>{const raw=r[ix.pct]||'';const z=n(raw);return z==null?null:(String(raw).includes('%')?z/100:(Math.abs(z)>1?z/100:z))})(),volume:n(r[ix.volume]),mRsi:n(r[ix.mRsi]),wRsi:n(r[ix.wRsi]),dRsi:n(r[ix.dRsi])})).filter(x=>x.symbol)}
async function importCSVs(){const date=document.getElementById('impDate').value;if(!date)return toast('Choose a run date');const files=[...document.getElementById('csvFiles').files];const x=importStateSets();if(x.conflicts.length){switchImportTab('status');return toast('Resolve CSV / Zero conflict first')}const groups=[];for(const f of files){const m=f.name.match(/(?:^|\D)(\d{3})(?:\D|$)/);if(!m||!state.registry[m[1]])continue;groups.push({code:m[1],file:f})}if(!groups.length&&!x.zeros.length)return toast('No scanner was run: add CSV and/or Confirmed Zero');
 const weekTag=document.getElementById('impWeek').value,monthTag=document.getElementById('impMonth').value;
 for(const g of groups){const text=await g.file.text();const parsed=parseChartink(text);await addRun(g.code,date,parsed,weekTag,monthTag)}for(const c of x.zeros){if(!groups.some(g=>g.code===c))await addRun(c,date,[],weekTag,monthTag)}
 state.importAudits=state.importAudits||[];state.importAudits.push({date,weeklyRun:weekTag,monthlyRun:monthTag,resultCodes:[...new Set(groups.map(g=>g.code))].sort(),zeroCodes:x.zeros,notRunCodes:x.notRun,importedAt:new Date().toISOString()});
 saveState();closeImport();render();toast(`${groups.length+x.zeros.length} run(s) updated · ${x.notRun.length} unchanged`)}
async function addRun(code,date,rows,weekTag,monthTag){const tf=registry(code).timeframe;const tag=tf==='Daily'?'CLOSE':tf==='Weekly'?weekTag:monthTag;const id=`${code}|${date}|${tag}`;state.records=state.records.filter(r=>r.runId!==id);state.runs=state.runs.filter(r=>r.id!==id);rows.forEach(r=>state.records.push({...r,date,runTag:tag,scanner:code,setup:registry(code).setup,runId:id}));state.runs.push({id,scanner:code,date,runTag:tag,count:rows.length,confirmed:true,source:rows.length?'CSV':'ZERO',importedAt:new Date().toISOString()})}

async function exportBackup(){const snaps=await idbAll().catch(()=>[]);const blob=new Blob([JSON.stringify({type:'TRINETRA_BACKUP_V1',exportedAt:new Date().toISOString(),state,snapshots:snaps},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`TRINETRA_BACKUP_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')}
async function restoreBackup(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.state||data.state.version!==1)throw new Error('Invalid');state=data.state;saveState();if(data.snapshots){await idbClear();for(const x of data.snapshots)await idbPut(x)}render();toast('Backup restored')}catch(err){alert('Invalid TRINETRA backup file.')}e.target.value=''}

let DBP=null;function db(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{const q=indexedDB.open('trinetra_fresh_20261025_charts_v1',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('snapshots'))q.result.createObjectStore('snapshots',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return DBP}
async function idbPut(x){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('snapshots','readwrite');tx.objectStore('snapshots').put(x);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbAll(){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('snapshots','readonly').objectStore('snapshots').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbDelete(id){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('snapshots','readwrite');tx.objectStore('snapshots').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbClear(){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('snapshots','readwrite');tx.objectStore('snapshots').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

document.getElementById('stockModal').addEventListener('click',e=>{if(e.target.id==='stockModal')closeStock()});document.getElementById('importModal').addEventListener('click',e=>{if(e.target.id==='importModal')closeImport()});
render();
</script>

<script>
/* TRINETRA v1.2 patch */
(function(){
  'use strict';

  function defaultWatchDefs(){return [1,2,3,4,5].map(n=>({id:'W'+String(n).padStart(2,'0'),label:'W'+String(n).padStart(2,'0')}))}
  function watchDefs(){return (state.watchDefs||defaultWatchDefs()).slice().sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}))}
  function normalizeWatchId(v){
    v=String(v||'').trim().toUpperCase(); if(!v)return '';
    if(/^W\d+$/.test(v)){const n=Number(v.slice(1));return 'W'+String(n).padStart(2,'0')}
    if(/^\d+$/.test(v))return 'W'+String(Number(v)).padStart(2,'0');
    return v;
  }
  function upgradeStateV12(){
    state.watchDefs=Array.isArray(state.watchDefs)&&state.watchDefs.length?state.watchDefs:defaultWatchDefs();
    const known=new Set(state.watchDefs.map(x=>x.id));
    Object.keys(state.watchlists||{}).forEach(sym=>{
      const old=state.watchlists[sym]; if(!old)return;
      const nw=normalizeWatchId(old); state.watchlists[sym]=nw;
      if(nw&&!known.has(nw)){state.watchDefs.push({id:nw,label:nw});known.add(nw)}
    });
    state.appVersion='1.2';
    saveState();
  }
  function tfKeyFromMeta(meta){const t=String(meta?.timeframe||'').toLowerCase();if(t.startsWith('daily'))return'daily';if(t.startsWith('weekly'))return'weekly';if(t.startsWith('monthly'))return'monthly';return'cup'}
  function scannerCodesFor(tf){return Object.keys(state.registry||{}).filter(c=>tfKeyFromMeta(state.registry[c])===tf).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))}
  function syncScannerRegistry(){
    for(const tf of ['daily','weekly','monthly','cup']){
      const a=scannerCodesFor(tf); TF_CODES[tf].splice(0,TF_CODES[tf].length,...a);
      if(!a.includes(ui.scanner[tf]))ui.scanner[tf]=a[0]||'';
    }
    const fam=new Map();Object.values(state.registry||{}).forEach(m=>{if(m.familyCode&&m.familyCode!=='CUP'&&!fam.has(m.familyCode))fam.set(m.familyCode,m.family||m.familyCode)});
    const rows=[...fam.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true}));
    FAMILY_FILTERS.splice(0,FAMILY_FILTERS.length,...rows);
  }
  function watchOptionsHTML(current,placeholder='—'){
    return `<option value="">${placeholder}</option>`+watchDefs().map(w=>`<option value="${esc(w.id)}" ${current===w.id?'selected':''}>${esc(w.label||w.id)}</option>`).join('');
  }

  function dlText(filename,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function fyersSymbols(symbols){return [...new Set((symbols||[]).map(x=>String(x||'').trim().toUpperCase()).filter(Boolean))].map(s=>`NSE:${s}-EQ`)}
  window.exportFyersScanner=function(code,runId){
    const run=state.runs.find(r=>r.id===runId)||latestRun(code);if(!run)return toast('No scanner run available to export');
    const symbols=fyersSymbols(recordsForRun(run.id).map(r=>r.symbol));if(!symbols.length)return toast('This scanner run has no stocks');
    dlText(`FYERS_${code}_${run.date}.txt`,symbols.join(','));toast(`${symbols.length} stocks exported for FYERS`)
  };
  window.exportFyersWatch=function(wid){
    const id=wid==='ALL'?'ALL':normalizeWatchId(wid);const all=currentUniverse().filter(x=>x.watch);const arr=id==='ALL'?all:all.filter(x=>x.watch===id);const symbols=fyersSymbols(arr.map(x=>x.symbol));if(!symbols.length)return toast('No stocks in this watchlist');
    dlText(`FYERS_${id}_${new Date().toISOString().slice(0,10)}.txt`,symbols.join(','));toast(`${symbols.length} stocks exported for FYERS`)
  };

  window.gotoScanner=function(code){const tf=tfKeyFromMeta(registry(code));ui.main=tf;ui.scanner[tf]=code;ui.run[code]=(latestRun(code)||{}).id||'';render()};
  window.watchSelect=function(symbol,val){const nw=normalizeWatchId(val),old=state.watchlists[symbol]||'';state.watchlists[symbol]=nw;logEvent(symbol,'watchlist',`Watchlist ${old||'—'} → ${nw||'—'}`);render();if(ui.stock===symbol)openStock(symbol,ui.stockTab)};

  window.motherFiltered=function(){let arr=currentUniverse();const f=ui.motherFilter;if(f==='MULTI')arr=arr.filter(x=>x.count>=3);if(f==='CUP')arr=arr.filter(x=>x.cup);if(f==='NEW')arr=arr.filter(x=>x.newFlag);if(f==='RE')arr=arr.filter(x=>x.reFlag);if(f==='KEEP')arr=arr.filter(x=>x.kept.length);if(/^W\d+$/i.test(f))arr=arr.filter(x=>x.watch===normalizeWatchId(f));if(ui.familyFilter)arr=arr.filter(x=>x.active.concat(x.kept).some(c=>registry(c).familyCode===ui.familyFilter));if(ui.search){const q=ui.search.toUpperCase();arr=arr.filter(x=>x.symbol.includes(q)||x.name.toUpperCase().includes(q))}return arr};

  window.renderMother=function(){const all=currentUniverse(),arr=motherFiltered();const multi=all.filter(x=>x.count>=3).length,cup=all.filter(x=>x.cup).length,newc=all.filter(x=>x.newFlag).length,re=all.filter(x=>x.reFlag).length,keep=all.filter(x=>x.kept.length).length;const wd=watchDefs();
    const watchKpis=wd.slice(0,3).map(w=>kpi(w.label||w.id,all.filter(x=>x.watch===w.id).length,w.id)).join('');
    return `<div class="section-head"><div><h1>MOTHER</h1><p>Unique stock universe · active scanner tags + kept-watch tags · no price/RSI clutter</p></div><div class="spacer"></div><button class="btn small" onclick="openStructure()">⚙ Structure</button></div>
    <div class="grid kpis">${kpi('ALL',all.length,'ALL')}${kpi('NEW',newc,'NEW')}${kpi('RE-ENTRY',re,'RE')}${kpi('MULTI 3+',multi,'MULTI')}${kpi('CUP',cup,'CUP','cup')}${kpi('KEEP WATCH',keep,'KEEP')}${watchKpis}</div>
    <div class="card toolbar"><input class="search" placeholder="Search symbol / stock name" value="${esc(ui.search)}" oninput="ui.search=this.value;render()"><div class="chiprow">${FAMILY_FILTERS.map(([c,l])=>`<button class="chip ${ui.familyFilter===c?'active':''}" onclick="setFamily('${esc(c)}')">${esc(c)} · ${esc(l)}</button>`).join('')}</div></div>
    <div class="card tablewrap desktop-table"><table><thead><tr><th>Symbol</th><th>Stock Name</th><th>Scanner Tags</th><th>Count</th><th>Signal</th><th>Rating</th><th>Watchlist</th><th>Last Seen</th></tr></thead><tbody>${arr.map(x=>`<tr class="${x.count>=3?'row-multi':''} ${x.cup?'row-cup':''}" onclick="openStock('${x.symbol}')"><td><span class="symbol">${x.symbol}</span></td><td>${esc(x.name)}</td><td>${x.active.map(c=>scannerBadge(c)).join('')}${x.kept.map(c=>scannerBadge(c,true)).join('')}</td><td>${x.count>=3?`<span class="badge multi">MULTI ×${x.count}</span>`:x.count}${x.cup?' <span class="badge cup">CUP</span>':''}</td><td>${x.newFlag?'<span class="badge new">NEW</span>':''}${x.reFlag?'<span class="badge re">RE-ENTRY</span>':''}${x.kept.length?'<span class="badge keep">KEEP</span>':''}</td><td>${renderRating(x.symbol,x.rating)}</td><td><select class="select-sm" onclick="event.stopPropagation()" onchange="watchSelect('${x.symbol}',this.value)">${watchOptionsHTML(x.watch)}</select></td><td>${fmtDate(x.last)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No stocks match this filter.</td></tr>'}</tbody></table></div>
    <div class="card mobile-card">${arr.map(x=>`<div class="stockcard" onclick="openStock('${x.symbol}')"><div class="top"><b>${x.symbol}</b>${x.count>=3?`<span class="badge multi">×${x.count}</span>`:''}</div><div class="nm">${esc(x.name)}</div><div>${x.active.map(c=>scannerBadge(c)).join('')}${x.kept.map(c=>scannerBadge(c,true)).join('')}</div><div class="muted" style="margin-top:5px">${x.watch||'No Watchlist'} · ${fmtDate(x.last)}</div></div>`).join('')||'<div class="empty">No stocks match this filter.</div>'}</div>`;
  };

  window.renderScannerPage=function(tf){const codes=scannerCodesFor(tf),code=(ui.scanner[tf]&&codes.includes(ui.scanner[tf]))?ui.scanner[tf]:(codes[0]||''),meta=registry(code),rs=code?runsFor(code).slice().reverse().slice(0,20):[];if(code)ui.scanner[tf]=code;let run=rs.find(r=>r.id===ui.run[code])||rs[0]||null;if(run)ui.run[code]=run.id;const recs=run?recordsForRun(run.id):[];const dropped=run&&latestRun(code)&&latestRun(code).id===run.id?droppedForRun(code,run):[];
    const title=tf==='daily'?'DAILY SCAN':tf==='weekly'?'WEEKLY SCAN':tf==='monthly'?'MONTHLY SCAN':'CUP / ATH SCAN';
    return `<div class="section-head"><div><h1>${title}</h1><p>${tf==='weekly'?'Mid-Week and Week-Close stay separate.':tf==='monthly'||tf==='cup'?'Mid-Month and Month-Close stay separate.':'Closing-basis scanner history.'}</p></div><div class="spacer"></div><button class="btn small" onclick="openStructure('${tf}')">＋ Scanner</button></div>
    <div class="card"><div class="subtabs">${codes.map(c=>{const lr=latestRun(c),z=lr&&lr.count===0;return `<button class="subtab ${c===code?'active':''} ${z?'zero':''}" onclick="selectScanner('${tf}','${c}')">${c}${z?' · 0':''}</button>`}).join('')}<button class="subtab add" onclick="openStructure('${tf}')">＋</button></div>

      <div class="structure-section"><h3>Add Scanner</h3><div class="formgrid"><div class="field"><label>Timeframe</label><select id="stTf" onchange="suggestStructureCode()"><option value="daily" ${tf==='daily'?'selected':''}>Daily</option><option value="weekly" ${tf==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${tf==='monthly'?'selected':''}>Monthly</option><option value="cup" ${tf==='cup'?'selected':''}>Cup / ATH</option></select></div><div class="field"><label>Scanner Code</label><input id="stCode" value="${suggestedScannerCode(tf)}" maxlength="3"></div><div class="field full"><label>Setup / Scanner Name</label><input id="stSetup" placeholder="e.g. D RSI + new setup"></div><div class="field"><label>Family Code</label><input id="stFamCode" placeholder="e.g. 08"></div><div class="field"><label>Family / Summary Name</label><input id="stFam" placeholder="e.g. Breakout Retest"></div></div><div class="inline-note">Use the matching timeframe prefix (1xx Daily, 2xx Weekly, 3xx Monthly, 4xx Cup/ATH). Once added, CSV filename detection, Import Status, Mother tags and FYERS export will recognize it automatically.</div><div style="height:9px"></div><button class="btn primary" onclick="addScannerStructure()">Add Scanner</button></div>

<script>
/* TRINETRA v1.3 Observation editor patch */
(() => {
  'use strict';
  const OBS_HL={red:'#7f1d1d',blue:'#1d4ed8',yellow:'#a16207',green:'#166534'};
  function obsSafeHTML(value){
    const raw=String(value??'');
    if(!raw)return '';
    // Legacy observations were plain text. Preserve them safely.
    if(!/<\/?(?:b|strong|span|div|p|br)\b/i.test(raw))return esc(raw).replace(/\n/g,'<br>');
    const t=document.createElement('template');t.innerHTML=raw;
    const allowed=new Set(['B','STRONG','SPAN','DIV','P','BR']);
    const clean=node=>{
      [...node.childNodes].forEach(ch=>{
        if(ch.nodeType===3)return;
        if(ch.nodeType!==1){ch.remove();return}
        if(!allowed.has(ch.tagName)){ch.replaceWith(document.createTextNode(ch.textContent||''));return}
        [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
        if(ch.tagName==='SPAN'){
          const oldStyle=(ch.getAttribute&&ch.getAttribute('style'))||'';
          // attributes were removed above; recover color from computed inline source when possible via raw style parsing
        }
        clean(ch);
      });
    };
    // Reparse while retaining only supported highlight background styles.
    const t2=document.createElement('template');t2.innerHTML=raw;
    const walk=node=>{
      [...node.childNodes].forEach(ch=>{
        if(ch.nodeType===3)return;
        if(ch.nodeType!==1){ch.remove();return}
        if(!allowed.has(ch.tagName)){ch.replaceWith(document.createTextNode(ch.textContent||''));return}
        let bg='';
        if(ch.tagName==='SPAN'){
          const st=(ch.getAttribute('style')||'').toLowerCase();
          const m=st.match(/background(?:-color)?\s*:\s*([^;]+)/);if(m)bg=m[1].trim();
        }
        [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
        if(ch.tagName==='SPAN'&&bg){
          const normalized=bg.replace(/\s/g,'');
          const ok=['#7f1d1d','#1d4ed8','#a16207','#166534','rgb(127,29,29)','rgb(29,78,216)','rgb(161,98,7)','rgb(22,101,52)'];
          if(ok.includes(normalized))ch.style.backgroundColor=bg;
        }
        walk(ch);
      });
    };
    walk(t2.content);return t2.innerHTML;
  }
  window.saveRichObs=function(symbol,field,el){
    state.observations[symbol]=state.observations[symbol]||{};
    state.observations[symbol][field]=el.innerHTML;
    state.observations[symbol].updatedAt=new Date().toISOString();
    saveState();
  };
  window.obsFormat=function(editorId,cmd,arg){
    const ed=document.getElementById(editorId);if(!ed)return;ed.focus();
    try{
      if(cmd==='highlight'){
        const c=OBS_HL[arg]||arg;
        if(!document.execCommand('hiliteColor',false,c))document.execCommand('backColor',false,c);
      }else if(cmd==='clear'){
        document.execCommand('removeFormat',false,null);
        try{document.execCommand('hiliteColor',false,'transparent')}catch(e){}
      }else document.execCommand(cmd,false,arg||null);
    }catch(e){}
    ed.dispatchEvent(new Event('input',{bubbles:true}));
  };
  function editor(symbol,field,label,value,full=false){
    const id=`obs_${symbol}_${field}`;
    return `<div class="obs-field ${full?'full':''}"><label>${label}</label><div class="obs-editor-wrap"><div class="obs-tools">
      <button class="obs-tool" title="Bold" onmousedown="event.preventDefault()" onclick="obsFormat('${id}','bold')"><b>B</b></button><span class="obs-sep"></span>
      <button class="obs-tool swatch red" title="Red highlighter" onmousedown="event.preventDefault()" onclick="obsFormat('${id}','highlight','red')"></button>
      <button class="obs-tool swatch blue" title="Blue highlighter" onmousedown="event.preventDefault()" onclick="obsFormat('${id}','highlight','blue')"></button>
      <button class="obs-tool swatch yellow" title="Yellow highlighter" onmousedown="event.preventDefault()" onclick="obsFormat('${id}','highlight','yellow')"></button>
      <button class="obs-tool swatch green" title="Green highlighter" onmousedown="event.preventDefault()" onclick="obsFormat('${id}','highlight','green')"></button><span class="obs-sep"></span>
      <button class="obs-tool clear" title="Clear formatting from selected text" onmousedown="event.preventDefault()" onclick="obsFormat('${id}','clear')">Clear</button>
      </div><div id="${id}" class="obs-editor" contenteditable="true" spellcheck="true" data-placeholder="Write observation…" oninput="saveRichObs('${symbol}','${field}',this)">${obsSafeHTML(value)}</div></div></div>`;
  }
  window.renderObs=function(s,o){
    return `<div class="notice">Minimal-input observation window · select text and use <b>B</b> or the four highlighters. Everything auto-saves.</div><div style="height:12px"></div><div class="formgrid">${editor(s.symbol,'overall','Quick / Overall Observation',o.overall||'',true)}${editor(s.symbol,'m','M View',o.m||'')}${editor(s.symbol,'w','W View',o.w||'')}${editor(s.symbol,'d','D View',o.d||'')}${editor(s.symbol,'h','H View',o.h||'')}${editor(s.symbol,'special','Special Notes',o.special||'',true)}</div>`;
  };
  // Refresh an open Observation tab immediately after this patch loads.
  if(typeof ui!=='undefined'&&ui.stock&&ui.stockTab==='obs'&&typeof renderStockDialog==='function')renderStockDialog();
})();
</script>

        <div class="field"><label>Trade Setup — Main Setup</label><input value="${esc(t.mainSetup)}" placeholder="Primary reason / setup" oninput="saveTradeField('${s.symbol}','mainSetup',this.value)"></div>
        <div class="field"><label>Supporting Favorable Setups</label><textarea oninput="saveTradeField('${s.symbol}','supportingSetups',this.value)">${esc(t.supportingSetups)}</textarea></div>
        <div class="field full"><label>Entry Chart Snap</label><div class="trade-snap-box"><input id="tradeEntryFile" type="file" accept="image/*"><button class="btn small primary" style="margin-left:6px" onclick="addTradeChart('${s.symbol}','entry')">Save Entry Chart</button><div id="tradeEntryPreview" style="margin-top:9px" class="muted">${t.entryChartId ? 'Loading saved chart…' : 'No entry chart saved.'}</div></div></div>
        <div class="field"><label>Last Exit Date</label><input type="date" value="${esc(t.lastExitDate)}" oninput="saveTradeField('${s.symbol}','lastExitDate',this.value)"></div>
        <div class="field"><label>Trade Outcome</label><select onchange="saveTradeField('${s.symbol}','outcome',this.value,true)"><option value="">— Select —</option><option value="Profitable" ${t.outcome === 'Profitable' ? 'selected' : ''}>Profitable</option><option value="Loss" ${t.outcome === 'Loss' ? 'selected' : ''}>Loss</option></select></div>
        <div class="field full"><label>Exit Chart Snap</label><div class="trade-snap-box"><input id="tradeExitFile" type="file" accept="image/*"><button class="btn small primary" style="margin-left:6px" onclick="addTradeChart('${s.symbol}','exit')">Save Exit Chart</button><div id="tradeExitPreview" style="margin-top:9px" class="muted">${t.exitChartId ? 'Loading saved chart…' : 'No exit chart saved.'}</div></div></div>
        ${outcomeFields}
        <div class="field full"><label>Final Comments</label><textarea oninput="saveTradeField('${s.symbol}','finalComments',this.value)">${esc(t.finalComments)}</textarea></div>
      </div>
      <div class="trade-actions"><button class="btn primary trade-yes" onclick="archiveTrade('${s.symbol}')">Archive Completed Trade</button><span class="trade-note">Archive saves a read-only Trade History record with the linked Entry/Exit charts, then clears this Trade form for the next cycle.</span></div>`;

    return `<div class="notice">Trade entry is optional. Keep <b>Traded = No</b> for watch-only stocks. If traded, fill the compact record after the trade is complete and Archive it.</div>
      <div style="height:12px"></div>
      <div class="trade-toggle"><div class="field" style="min-width:220px"><label>Traded</label><select onchange="saveTradeField('${s.symbol}','traded',this.value,true)"><option value="NO" ${!yes ? 'selected' : ''}>No</option><option value="YES" ${yes ? 'selected' : ''}>Yes</option></select></div>${yes ? '<span class="badge keep">TRADE RECORD OPEN</span>' : ''}</div>
      ${details}`;
  };

  async function idbById(id){
    if(!id) return null;
    try { return (await idbAll()).find(x => x.id === id) || null; } catch(e){ return null; }
  }

  async function showTradeChartIn(id, targetId, label){
    const el = document.getElementById(targetId); if(!el) return;
    const x = await idbById(id);
    if(!x){ el.innerHTML = '<span class="muted">Saved chart not found.</span>'; return; }
    el.innerHTML = `<div class="trade-snap-preview"><img src="${x.data}" onclick="window.open(this.src,'_blank')"><div><b>${label}</b><div class="muted">${new Date(x.addedAt).toLocaleString()}</div><button class="btn small danger" style="margin-top:7px" onclick="removeTradeChart('${x.symbol}','${x.role}','${x.id}')">Remove</button></div></div>`;
  }

  window.loadTradeDraftCharts = async function(symbol){
    const t = tradeDraft(symbol);
    if(t.entryChartId) await showTradeChartIn(t.entryChartId, 'tradeEntryPreview', 'Entry chart');
    if(t.exitChartId) await showTradeChartIn(t.exitChartId, 'tradeExitPreview', 'Exit chart');
  };

  window.addTradeChart = async function(symbol, role){
    const input = document.getElementById(role === 'entry' ? 'tradeEntryFile' : 'tradeExitFile');
    const f = input?.files?.[0]; if(!f) return toast('Choose a chart image first');
    const t = tradeDraft(symbol), key = role === 'entry' ? 'entryChartId' : 'exitChartId';
    if(t[key]){ try{ await idbDelete(t[key]); }catch(e){} }
    const id = crypto.randomUUID(), data = await fileToDataURL(f);
    await idbPut({id,type:'trade',symbol,role,name:f.name,addedAt:new Date().toISOString(),data});
    t[key] = id; t.updatedAt = new Date().toISOString(); saveState();
    await loadTradeDraftCharts(symbol); toast(`${role === 'entry' ? 'Entry' : 'Exit'} chart saved`);
  };

  window.removeTradeChart = async function(symbol, role, id){
    const t = tradeDraft(symbol), key = role === 'entry' ? 'entryChartId' : 'exitChartId';
    if(t[key] === id) t[key] = '';
    try{ await idbDelete(id); }catch(e){}
    saveState(); renderStockDialog(); toast('Trade chart removed');
  };

  window.archiveTrade = async function(symbol){
    const t = tradeDraft(symbol);
    if(t.traded !== 'YES') return toast('Set Traded = Yes first');
    const missing=[];
    if(!t.initialEntryDate) missing.push('Initial Entry Date');
    if(!t.lastExitDate) missing.push('Last Exit Date');
    if(!t.outcome) missing.push('Trade Outcome');
    if(missing.length) return alert('Before Archive, please complete:\n• ' + missing.join('\n• '));
    if(!confirm(`Archive this completed ${t.outcome} trade for ${symbol}?\n\nThe Trade form will reset for the next trade cycle.`)) return;
    const rec = {...t,id:crypto.randomUUID(),symbol,archivedAt:new Date().toISOString()};
    tradeList(symbol).push(rec);
    for(const cid of [rec.entryChartId,rec.exitChartId].filter(Boolean)){
      const x = await idbById(cid); if(x) await idbPut({...x,tradeRecordId:rec.id,archived:true});
    }
    state.tradeDrafts[symbol] = blankTrade(); saveState();
    ui.stockTab='history'; ui.historyPane='trade'; renderStockDialog(); toast('Trade archived to Trade History');
  };

  function scanAbbr(run){
    const tf=String(registry(run.scanner).timeframe||'');
    if(tf==='Daily') return 'DC';
    if(tf==='Weekly') return run.runTag==='WEEK CLOSE' ? 'WC' : 'MW';
    if(tf==='Monthly'||tf==='Cup/ATH') return run.runTag==='MONTH CLOSE' ? 'MC' : 'MM';
    return run.runTag||'';
  }

  function scanHistoryGroups(symbol){
    const groups={};
    for(const run of state.runs){
      if(!state.records.some(r=>r.runId===run.id&&r.symbol===symbol)) continue;
      const raw=run.importedAt||`${run.date}T12:00:00`;
      let d=new Date(raw); if(Number.isNaN(d.getTime())) d=new Date(`${run.date}T12:00:00`);
      d.setMilliseconds(0);
      const bucket=d.toISOString().slice(0,16); // one import session is grouped to the minute
      if(!groups[bucket]) groups[bucket]={at:d,codes:[]};
      groups[bucket].codes.push(`${run.scanner} (${scanAbbr(run)})`);
    }
    return Object.values(groups).map(g=>({at:g.at,codes:[...new Set(g.codes)].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))})).sort((a,b)=>b.at-a.at);
  }

  window.setHistoryPane=function(p){ ui.historyPane=p; renderStockDialog(); };

  window.renderHistory=function(s){
    const pane=ui.historyPane||'scan';
    const scans=scanHistoryGroups(s.symbol);
    const trades=tradeList(s.symbol).slice().sort((a,b)=>(b.initialEntryDate||'').localeCompare(a.initialEntryDate||'')||(b.archivedAt||'').localeCompare(a.archivedAt||''));
    const switcher=`<div class="history-switch"><button class="btn ${pane==='scan'?'active':''}" onclick="setHistoryPane('scan')">Scan History</button><button class="btn ${pane==='trade'?'active':''}" onclick="setHistoryPane('trade')">Trade History${trades.length?` (${trades.length})`:''}</button></div>`;
    if(pane==='scan'){
      const body=scans.length?scans.map(g=>`<div class="scan-history-row"><div class="stamp">${g.at.toLocaleString()}</div><div class="scan-codes">${g.codes.map(esc).join(', ')}</div></div>`).join(''):'<div class="muted">No scanner history yet.</div>';
      return switcher+`<div>${body}</div>`;
    }
    const body=trades.length?trades.map(t=>{
      const cls=t.outcome==='Profitable'?'outcome-profit':t.outcome==='Loss'?'outcome-loss':'';
      const date=t.initialEntryDate?new Date(t.initialEntryDate+'T00:00:00').toLocaleDateString():'—';
      const meta=`${esc(brokerLabel(t))}${t.mainSetup?` · ${esc(t.mainSetup)}`:''}`;
      return `<div class="trade-history-row"><div><b>${date}</b></div><div class="${cls}"><b>${tradeOutcomeLabel(t)}</b><div class="muted">${meta}</div></div><button class="btn small" onclick="openArchivedTrade('${s.symbol}','${t.id}')">View Archived Trade</button></div>`;
    }).join(''):'<div class="muted">No archived trades yet.</div>';
    return switcher+`<div>${body}</div>`;
  };

  function ensureArchiveModal(){
    if(document.getElementById('tradeArchiveModal')) return;
    const m=document.createElement('div');m.className='modal';m.id='tradeArchiveModal';m.innerHTML='<div class="dialog archive-dialog" id="tradeArchiveDialog"></div>';
    m.addEventListener('click',e=>{if(e.target.id==='tradeArchiveModal') closeArchivedTrade();}); document.body.appendChild(m);
  }
  window.closeArchivedTrade=function(){ document.getElementById('tradeArchiveModal')?.classList.remove('show'); };

  window.openArchivedTrade=async function(symbol,id){
    ensureArchiveModal();
    const t=tradeList(symbol).find(x=>x.id===id); if(!t) return toast('Archived trade not found');
    const m=document.getElementById('tradeArchiveModal'),box=document.getElementById('tradeArchiveDialog'); m.classList.add('show');
    const outcomeCls=t.outcome==='Profitable'?'outcome-profit':'outcome-loss';
    box.innerHTML=`<div class="dialog-head"><div><b>${symbol} · Archived Trade</b><div class="muted" style="font-size:12px">Initial Entry ${t.initialEntryDate?new Date(t.initialEntryDate+'T00:00:00').toLocaleDateString():'—'} · Archived ${new Date(t.archivedAt).toLocaleString()}</div></div><div class="spacer"></div><button class="btn small ghost" onclick="closeArchivedTrade()">✕</button></div>
      <div class="dialog-body"><div class="archive-grid">
        <div class="archive-card"><div class="label">Broker</div><b>${esc(brokerLabel(t))}</b></div>
        <div class="archive-card"><div class="label">Outcome</div><b class="${outcomeCls}">${tradeOutcomeLabel(t)}</b></div>
        <div class="archive-card"><div class="label">Initial Entry Date</div>${esc(t.initialEntryDate||'—')}</div>
        <div class="archive-card"><div class="label">Last Exit Date</div>${esc(t.lastExitDate||'—')}</div>
        <div class="archive-card"><div class="label">Main Setup</div>${esc(t.mainSetup||'—')}</div>
        <div class="archive-card"><div class="label">Supporting Favorable Setups</div>${esc(t.supportingSetups||'—').replace(/\n/g,'<br>')}</div>
        <div class="archive-card full"><div class="label">${t.outcome==='Loss'?'Loss':'Profit'} Reason</div>${esc(t.reason||'—').replace(/\n/g,'<br>')}</div>
        <div class="archive-card full"><div class="label">Final Comments</div>${esc(t.finalComments||'—').replace(/\n/g,'<br>')}</div>
        <div class="archive-card full"><div class="label">Entry Chart</div><div id="archEntry">${t.entryChartId?'Loading…':'No entry chart archived.'}</div></div>
        <div class="archive-card full"><div class="label">Exit Chart</div><div id="archExit">${t.exitChartId?'Loading…':'No exit chart archived.'}</div></div>
      </div></div>`;
    for(const [cid,target] of [[t.entryChartId,'archEntry'],[t.exitChartId,'archExit']]){
      if(!cid) continue; const x=await idbById(cid),el=document.getElementById(target);
      if(el) el.innerHTML=x?`<img class="archive-chart" src="${x.data}" onclick="window.open(this.src,'_blank')"><div class="muted" style="margin-top:5px">${esc(x.name||'Chart')} · ${new Date(x.addedAt).toLocaleString()}</div>`:'<span class="muted">Archived chart not found.</span>';
    }
  };

  window.renderStockDialog=function(){
    const s=stockInfo(ui.stock),obs=state.observations[s.symbol]||{},fund=state.fundamentals[s.symbol]||{};
    const tabs=[['obs','Observation'],['charts','Chart Snaps'],['trade','Trade'],['history','History'],['fund','Fundamental']];
    let body='';
    if(ui.stockTab==='obs') body=renderObs(s,obs); else if(ui.stockTab==='charts') body=renderCharts(s); else if(ui.stockTab==='trade') body=renderTrade(s); else if(ui.stockTab==='history') body=renderHistory(s); else body=renderFund(s,fund);
    document.getElementById('stockDialog').innerHTML=`<div class="dialog-head"><div><div style="font-size:20px;font-weight:800">${s.symbol}</div><div class="muted" style="font-size:12px">${esc(s.name)}</div></div><div style="margin-left:8px">${s.active.map(c=>scannerBadge(c)).join('')}${s.kept.map(c=>scannerBadge(c,true)).join('')}</div><div class="spacer"></div><div>${renderRating(s.symbol,state.ratings[s.symbol]||0)}</div><select class="select-sm" onchange="watchSelect('${s.symbol}',this.value)">${watchOptionsV14(state.watchlists[s.symbol]||'','Watch —')}</select><button class="btn small ghost" onclick="closeStock()">✕</button></div><div class="dialog-tabs">${tabs.map(([k,l])=>`<button class="dialog-tab ${ui.stockTab===k?'active':''}" onclick="stockTab('${k}')">${l}</button>`).join('')}</div><div class="dialog-body" id="stockBody">${body}</div>`;
    if(ui.stockTab==='charts') loadSnapshots(s.symbol);
    if(ui.stockTab==='trade') loadTradeDraftCharts(s.symbol);
  };

  const prevRestore=window.restoreBackup;
  if(typeof prevRestore==='function') window.restoreBackup=async function(e){ await prevRestore(e); upgradeTradeState(); render(); };
  upgradeTradeState(); ensureArchiveModal(); document.title='TRINETRA Scanner Dashboard · v1.4';
  if(ui.stock) renderStockDialog();
})();

</script>

<script>
(() => {
  'use strict';

  window.saveAndExitStock = function(){
    try{ if(typeof saveState==='function') saveState(); }catch(e){}
    if(typeof closeStock==='function') closeStock();
  };

  const renderStockDialogV15Base = window.renderStockDialog;
  if(typeof renderStockDialogV15Base === 'function'){
    window.renderStockDialog = function(){
      const r = renderStockDialogV15Base.apply(this, arguments);
      const body = document.getElementById('stockBody');
      if(body && !body.querySelector('.save-exit-bar')){
        const bar = document.createElement('div');
        bar.className = 'save-exit-bar';
        bar.innerHTML = '<button class="btn primary save-exit-btn" onclick="saveAndExitStock()">✓ Save &amp; Exit</button>';
        body.appendChild(bar);
      }
      return r;
    };
  }

  function markRestoreSuccess(fileName){
    const el=document.getElementById('restoreSuccessMark');
    if(!el)return;
    const when=new Date();
    el.innerHTML='<span class="tick">✓</span><span class="restore-label">Restored</span>';
    el.title='Restore successful'+(fileName?' · '+fileName:'')+' · '+when.toLocaleString();
    el.classList.add('show');
    const btn=document.getElementById('restoreBackupBtn');
    if(btn) btn.title=el.title;
  }

  // Keep the full proven restore chain from v1.4 (including structure/trade upgrades),
  // but suppress only its transient "Backup restored" toast and show a persistent green mark instead.
  const restoreBackupV15Base = window.restoreBackup;
  if(typeof restoreBackupV15Base === 'function'){
    window.restoreBackup = async function(e){
      const f=e && e.target && e.target.files ? e.target.files[0] : null;
      if(!f)return;
      let restored=false;
      const originalToast=window.toast;
      if(typeof originalToast === 'function'){
        window.toast=function(msg){
          if(String(msg||'').toLowerCase().includes('backup restored')){ restored=true; return; }
          return originalToast.apply(this, arguments);
        };
      }
      try{
        await restoreBackupV15Base.call(this,e);
      } finally {
        if(typeof originalToast === 'function') window.toast=originalToast;
      }
      if(restored) markRestoreSuccess(f.name);
    };
  }

  document.title='TRINETRA Scanner Dashboard · v1.5';
})();
</script>

<style>

.sync-permission-callout{margin-top:10px;padding:10px 11px;border-radius:10px;border:1px solid #8a6b2d;background:#2a210f;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sync-permission-callout .msg{flex:1;min-width:220px;color:#f7cf80;font-size:11px;line-height:1.45}.sync-permission-callout .msg b{color:#ffe3a8}.btn.sync-permission{background:#5a4215;border-color:#b98b35;color:#fff3cf;font-weight:900}.sync-permission-ok{display:inline-flex;align-items:center;gap:6px;color:#86efac;font-weight:900}
@media(max-width:720px){.sync-status-chip .sync-status-text{display:none}.sync-kv{grid-template-columns:1fr}.sync-kv .k{margin-top:4px}}
</style>
<script>
(() => {
  'use strict';
  const SYNC_META_KEY='trinetra_fresh_20261025_portable_sync_meta_v1';
  const DEVICE_KEY='trinetra_fresh_20261025_portable_device_v1';
  const HANDLE_DB='trinetra_fresh_20261025_portable_sync_handles_v1';
  const HANDLE_STORE='handles';
  const HANDLE_KEY='primary';
  let syncHandle=null;
  let syncRemoteMeta=null;

  function apiSupported(){return !!(window.showOpenFilePicker&&window.showSaveFilePicker&&window.isSecureContext)}
  function syncToast(msg){try{if(typeof toast==='function')return toast(msg)}catch(e){} console.log(msg)}
  function safeJSON(s,fallback={}){try{return JSON.parse(s)||fallback}catch(e){return fallback}}
  function getMeta(){return safeJSON(localStorage.getItem(SYNC_META_KEY)||'{}',{})}
  function setMeta(p){const m={...getMeta(),...p};localStorage.setItem(SYNC_META_KEY,JSON.stringify(m));return m}
  function getDevice(){let d=safeJSON(localStorage.getItem(DEVICE_KEY)||'{}',{});if(!d.id){d={id:(crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random().toString(16).slice(2)),label:''};localStorage.setItem(DEVICE_KEY,JSON.stringify(d))}return d}
  function setDeviceLabel(label){const d=getDevice();d.label=String(label||'').trim();localStorage.setItem(DEVICE_KEY,JSON.stringify(d));return d}
  function fmtTime(v){if(!v)return '—';try{return new Date(v).toLocaleString()}catch(e){return String(v)}}
  function setSyncActionStatus(kind,text){const el=document.getElementById('syncActionStatus');if(!el)return;el.className='sync-action-status '+(kind||'');el.textContent=text||''}
  function markSyncOK(label,at){setSyncActionStatus('ok','✓ '+label+(at?' · '+fmtTime(at):''))}
  function markSyncError(text){setSyncActionStatus('err','⚠ '+text)}

  function hdb(){return new Promise((res,rej)=>{const q=indexedDB.open(HANDLE_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(HANDLE_STORE))q.result.createObjectStore(HANDLE_STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
  async function putHandle(h){try{const d=await hdb();await new Promise((res,rej)=>{const tx=d.transaction(HANDLE_STORE,'readwrite');tx.objectStore(HANDLE_STORE).put(h,HANDLE_KEY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}catch(e){console.warn('Could not persist sync handle',e)}}
  async function getHandle(){try{const d=await hdb();return await new Promise((res,rej)=>{const q=d.transaction(HANDLE_STORE,'readonly').objectStore(HANDLE_STORE).get(HANDLE_KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){return null}}
  async function clearHandle(){try{const d=await hdb();await new Promise((res,rej)=>{const tx=d.transaction(HANDLE_STORE,'readwrite');tx.objectStore(HANDLE_STORE).delete(HANDLE_KEY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}catch(e){}}

  async function permission(handle,write=false,ask=false){if(!handle)return false;const opts={mode:write?'readwrite':'read'};try{if(handle.queryPermission){const q=await handle.queryPermission(opts);if(q==='granted')return true;if(q==='denied'&&!ask)return false}if(ask&&handle.requestPermission){return (await handle.requestPermission(opts))==='granted'}return false}catch(e){return false}}

  async function readPayload(handle=syncHandle){if(!handle)throw new Error('No sync file connected');const f=await handle.getFile();const data=JSON.parse(await f.text());if(data.type!=='TRINETRA_PORTABLE_SYNC_V1'||!data.state||data.state.version!==1)throw new Error('This is not a TRINETRA Portable Sync file');return data}
  async function buildPayload(){try{if(typeof saveState==='function')saveState()}catch(e){}const snaps=await idbAll().catch(()=>[]);const d=getDevice(),now=new Date().toISOString();return {type:'TRINETRA_PORTABLE_SYNC_V1',formatVersion:1,savedAt:now,savedBy:{id:d.id,label:d.label||''},state,snapshots:snaps}}
  async function writePayload(handle,payload){const w=await handle.createWritable();await w.write(JSON.stringify(payload));await w.close()}

  function baselineTime(){const m=getMeta();return m.lastRemoteSeenAt||m.lastSavedAt||''}
  function remoteIsNewer(remote){if(!remote?.savedAt)return false;const b=baselineTime();return !!b&&remote.savedAt>b}

  function statusFromPermission(granted){if(!apiSupported())return {kind:'error',text:'Sync unavailable'};if(!syncHandle)return {kind:'',text:'Sync not linked'};if(granted)return {kind:'ready',text:'Sync linked'};return {kind:'warn',text:'Permission needed'}}
  function updateTopStatus(granted){const el=document.getElementById('portableSyncStatus');if(!el)return;const s=statusFromPermission(granted);el.className='sync-status-chip '+s.kind;el.innerHTML='<span class="dot"></span><span class="sync-status-text">'+s.text+'</span>';const m=getMeta();el.title=(syncHandle?'Linked file: '+(syncHandle.name||m.fileName||'TRINETRA sync file'):'No Dropbox sync file linked')+(m.lastSavedAt?' · Last save: '+fmtTime(m.lastSavedAt):'')}

  async function refreshSyncUI(){let granted=false;if(syncHandle)granted=await permission(syncHandle,true,false);updateTopStatus(granted);const body=document.getElementById('portableSyncBody');if(!body)return;const m=getMeta(),d=getDevice();let remote=syncRemoteMeta;const linked=!!syncHandle;const support=apiSupported();body.innerHTML=`<div class="sync-panel">
    <div class="notice ${support?'':'warn'}"><b>${support?'Portable Sync ready':'Portable Sync API unavailable in this browser/mode'}</b><br>${support?'Choose one JSON file inside your local Dropbox folder. Desktop and Laptop can each connect to their local synced copy of that same file.':'Use Chrome or Edge desktop and open this HTML as a local file. Backup/Restore remains available as fallback.'}</div>
    <div class="sync-card"><h3>Connection</h3><div class="sync-kv"><div class="k">Linked file</div><div class="sync-file-name">${linked?esc(syncHandle.name||m.fileName||'Connected file'):'Not connected'}</div><div class="k">Write permission</div><div class="${granted?'sync-good':'sync-warn'}">${linked?(granted?'<span class="sync-permission-ok">✓ Granted</span>':'Needs permission'):'—'}</div><div class="k">This device</div><div><input id="syncDeviceLabel" class="search" style="max-width:320px;padding:6px 8px" placeholder="e.g. Office Desktop / Home Laptop" value="${esc(d.label||'')}"></div></div><div class="sync-actions" style="margin-top:10px"><button class="btn sync-create" onclick="portableCreateFile()">＋ Create &amp; Initial Sync</button><button class="btn" onclick="portableConnectFile()">🔗 Connect Existing</button><button class="btn danger" onclick="portableDisconnect()" ${linked?'':'disabled'}>Disconnect</button></div>${linked&&!granted?'<div class="sync-permission-callout"><div class="msg"><b>Write permission needed for this session.</b><br>Latest data can still be reloaded. Grant permission before you expect to Save &amp; Sync.</div><button class="btn sync-permission" onclick="portableGrantPermission()">✓ Grant Write Permission</button></div>':''}<div class="sync-note" style="margin-top:8px">Create &amp; Initial Sync already writes the current TRINETRA data into the new JSON file. You do not need to press Save &amp; Sync again immediately after creation.</div></div>
    <div class="sync-card"><h3>Daily hand-off</h3><div class="sync-actions"><button class="btn sync-save" onclick="portableSaveSync()" ${linked?'':'disabled'}>☁ Save &amp; Sync</button><button class="btn sync-load" onclick="portableReloadLatest()" ${linked?'':'disabled'}>↻ Reload Latest</button><button class="btn" onclick="portableReadRemoteInfo()" ${linked?'':'disabled'}>Check File</button><span id="syncActionStatus" class="sync-action-status"></span></div><div class="sync-kv" style="margin-top:11px"><div class="k">Last local save</div><div>${fmtTime(m.lastSavedAt)}</div><div class="k">Last reload</div><div>${fmtTime(m.lastLoadedAt)}</div><div class="k">Remote saved at</div><div>${remote?fmtTime(remote.savedAt):'Not checked'}</div><div class="k">Remote saved by</div><div>${remote?(esc(remote.savedBy?.label||remote.savedBy?.id||'Unknown device')):'—'}</div></div></div>
    <div class="sync-card"><h3>Safe sequence</h3><div class="sync-step"><span class="n">1</span><div><b>Device A — Save & Sync</b><span>Wait until Dropbox says Up to date, then close TRINETRA.</span></div></div><div class="sync-step" style="margin-top:9px"><span class="n">2</span><div><b>Device B — Reload Latest</b><span>After Dropbox finishes syncing, reload the connected file before editing.</span></div></div><div class="sync-step" style="margin-top:9px"><span class="n">3</span><div><b>Never edit both together</b><span>Portable Sync deliberately uses explicit buttons rather than background auto-write, reducing conflict risk.</span></div></div></div>
    <div class="sync-note">Safety guard: before Save & Sync, TRINETRA checks the connected file. If it is newer than the last file this device loaded/saved, overwrite is blocked and you will be asked to Reload Latest first. Manual Backup/Restore stays available for recovery.</div>
  </div>`;const inp=document.getElementById('syncDeviceLabel');if(inp)inp.onchange=()=>{setDeviceLabel(inp.value);refreshSyncUI()}}

  window.openPortableSync=async function(){const m=document.getElementById('portableSyncModal');if(m)m.classList.add('show');await refreshSyncUI()}
  window.closePortableSync=function(){document.getElementById('portableSyncModal')?.classList.remove('show')}

  window.portableCreateFile=async function(){if(!apiSupported())return syncToast('Portable Sync needs Chrome/Edge desktop');try{const h=await showSaveFilePicker({suggestedName:'TRINETRA_PORTABLE_DATA.json',types:[{description:'TRINETRA Sync JSON',accept:{'application/json':['.json']}}]});syncHandle=h;await putHandle(h);setMeta({fileName:h.name,linkedAt:new Date().toISOString()});const payload=await buildPayload();await writePayload(h,payload);syncRemoteMeta={savedAt:payload.savedAt,savedBy:payload.savedBy};setMeta({lastSavedAt:payload.savedAt,lastRemoteSeenAt:payload.savedAt});await refreshSyncUI();markSyncOK('Initial sync saved',payload.savedAt);syncToast('✓ Sync file created and current data saved')}catch(e){if(e?.name!=='AbortError'){console.error(e);markSyncError('Create failed');alert('Could not create the sync file: '+e.message)}}}

  window.portableConnectFile=async function(){if(!apiSupported())return syncToast('Portable Sync needs Chrome/Edge desktop');try{const [h]=await showOpenFilePicker({multiple:false,types:[{description:'TRINETRA Sync JSON',accept:{'application/json':['.json']}}]});syncHandle=h;let ok=await permission(h,true,true);if(!ok)throw new Error('Read/write permission was not granted');const data=await readPayload(h);syncRemoteMeta={savedAt:data.savedAt,savedBy:data.savedBy};await putHandle(h);setMeta({fileName:h.name,linkedAt:new Date().toISOString()});await refreshSyncUI();setSyncActionStatus('info','✓ File connected · use Reload Latest before editing');syncToast('Sync file connected')}catch(e){if(e?.name!=='AbortError'){console.error(e);markSyncError('Connect failed');alert('Could not connect the sync file: '+e.message)}}}

  window.portableGrantPermission=async function(){if(!syncHandle)return;setSyncActionStatus('info','Requesting write permission…');const ok=await permission(syncHandle,true,true);if(!ok){markSyncError('Write permission not granted');return}await putHandle(syncHandle);await refreshSyncUI();markSyncOK('Write permission granted',new Date().toISOString());syncToast('✓ Write permission granted')}

  window.portableReadRemoteInfo=async function(){if(!syncHandle)return;try{if(!(await permission(syncHandle,false,true)))throw new Error('File permission not granted');const data=await readPayload();syncRemoteMeta={savedAt:data.savedAt,savedBy:data.savedBy};setMeta({fileName:syncHandle.name});await refreshSyncUI();setSyncActionStatus('info','✓ File readable · remote '+fmtTime(data.savedAt));syncToast('Sync file checked')}catch(e){console.error(e);markSyncError('Check failed');alert('Could not read sync file: '+e.message)}}

  window.portableSaveSync=async function(){if(!syncHandle)return syncToast('Connect a sync file first');try{setSyncActionStatus('info','Saving…');if(!(await permission(syncHandle,true,true)))throw new Error('Write permission not granted — click Grant Permission or Connect Existing and select the same JSON file');let remote=null;try{remote=await readPayload()}catch(e){if(!String(e.message).includes('not a TRINETRA'))remote=null;else throw e}syncRemoteMeta=remote?{savedAt:remote.savedAt,savedBy:remote.savedBy}:null;if(remote&&remoteIsNewer(remote)){await refreshSyncUI();markSyncError('Newer Dropbox data found — Reload Latest first');return alert('A newer TRINETRA sync file exists in Dropbox.\n\nReload Latest first, review it, then continue working. Save & Sync has been blocked to prevent overwriting newer data.')}const payload=await buildPayload();await writePayload(syncHandle,payload);syncRemoteMeta={savedAt:payload.savedAt,savedBy:payload.savedBy};setMeta({fileName:syncHandle.name,lastSavedAt:payload.savedAt,lastRemoteSeenAt:payload.savedAt});await refreshSyncUI();markSyncOK('Saved & synced locally',payload.savedAt);syncToast('✓ Saved to Dropbox sync file')}catch(e){console.error(e);markSyncError('Save failed');alert('Save & Sync failed: '+e.message)}}

  window.portableReloadLatest=async function(){if(!syncHandle)return syncToast('Connect a sync file first');try{setSyncActionStatus('info','Loading…');if(!(await permission(syncHandle,false,true)))throw new Error('Read permission not granted');const data=await readPayload();const who=data.savedBy?.label||data.savedBy?.id||'another device';if(!confirm('Reload Latest will replace this browser\'s current TRINETRA state and chart images with the connected Dropbox file.\n\nRemote save: '+fmtTime(data.savedAt)+'\nSaved by: '+who+'\n\nContinue?')){setSyncActionStatus('info','Reload cancelled');return}state=data.state;try{if(typeof saveState==='function')saveState()}catch(e){}if(Array.isArray(data.snapshots)){await idbClear();for(const x of data.snapshots)await idbPut(x)}syncRemoteMeta={savedAt:data.savedAt,savedBy:data.savedBy};const loadedAt=new Date().toISOString();setMeta({fileName:syncHandle.name,lastLoadedAt:loadedAt,lastRemoteSeenAt:data.savedAt});try{if(typeof render==='function')render();if(ui?.stock)renderStockDialog()}catch(e){console.warn(e)}const writeOK=await permission(syncHandle,true,false);await refreshSyncUI();if(writeOK){markSyncOK('Latest loaded · Ready to edit',loadedAt)}else{setSyncActionStatus('info','✓ Latest loaded · Grant write permission before next Save')}syncToast('✓ Latest Dropbox data loaded')}catch(e){console.error(e);markSyncError('Reload failed');alert('Reload Latest failed: '+e.message)}}

  window.portableDisconnect=async function(){if(!syncHandle)return;if(!confirm('Disconnect this browser from the Dropbox sync file? Your TRINETRA data will remain in the browser and in the sync file.'))return;syncHandle=null;syncRemoteMeta=null;await clearHandle();localStorage.removeItem(SYNC_META_KEY);await refreshSyncUI();syncToast('Portable Sync disconnected')}

  async function boot(){const top=document.querySelector('.topbar');if(top&&!document.getElementById('portableSyncBtn')){const restore=document.getElementById('restoreBackupBtn');const b=document.createElement('button');b.id='portableSyncBtn';b.className='btn sync-top-btn';b.innerHTML='☁ <span>Portable Sync</span>';b.onclick=()=>openPortableSync();const s=document.createElement('span');s.id='portableSyncStatus';s.className='sync-status-chip';s.innerHTML='<span class="dot"></span><span class="sync-status-text">Sync not linked</span>';top.insertBefore(b,restore);top.insertBefore(s,restore)}if(!document.getElementById('portableSyncModal')){const m=document.createElement('div');m.className='modal';m.id='portableSyncModal';m.innerHTML='<div class="dialog sm"><div class="dialog-head"><div><div style="font-size:18px;font-weight:800">Dropbox Portable Sync</div><div class="muted" style="font-size:12px">One Dropbox-synced JSON data file · explicit save/reload · clear permission status · conflict guard</div></div><div class="spacer"></div><button class="btn small ghost" onclick="closePortableSync()">✕</button></div><div class="dialog-body" id="portableSyncBody"></div></div>';document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target.id==='portableSyncModal')closePortableSync()})}if(apiSupported())syncHandle=await getHandle();let granted=false;if(syncHandle)granted=await permission(syncHandle,true,false);updateTopStatus(granted);document.title='TRINETRA Scanner Dashboard · v1.6.2 Portable Sync';const sub=document.querySelector('.subbrand');if(sub)sub.textContent='Scanner Command Center · v1.6.2 Portable Sync'}
  setTimeout(boot,80);
})();
</script>

<!-- TRINETRA v1.7 — Live workflow refinement: fixed Mother list, holdings, Cup Watch/Ignore, note indicators -->
<style>

.badge.traded{border-color:#2f8f72;color:#86efac;background:#0d2d25}.badge.holding{border-color:#556a92;color:#c8d8ff;background:#111d36}.badge.cupwatch{border-color:#a77726;color:#ffd47e;background:#2a210d}.badge.ignored{border-color:#78343b;color:#ffb0b4;background:#2a1519}.row-ignored{opacity:.48;filter:saturate(.7)}
.holding-divider{width:1px;background:var(--line);margin:4px 3px;align-self:stretch}.watchtabs{overflow:auto;flex-wrap:nowrap}.watchtabs .holding-tab{border-color:#425b83}.watchtabs .holding-tab.active{background:#17284a;border-color:#6d8dca}
.cup-manage{padding:12px;margin-bottom:12px}.cup-manage-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.cup-manage-head .spacer{flex:1}.cup-entry-row{display:grid;grid-template-columns:180px 1fr auto;gap:8px;margin-top:10px}.cup-entry-row input{background:#08111f;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px}.cup-chip-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.cup-manual-chip,.cup-ignore-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #795d27;background:#221b0c;border-radius:999px;padding:5px 8px 5px 10px;font-size:11px}.cup-ignore-chip{border-color:#65323a;background:#261316}.cup-manual-chip button,.cup-ignore-chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-weight:900;padding:0 2px}.cup-decision{display:flex;gap:6px;align-items:center;white-space:nowrap}.cup-decision select{background:#08111f;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:11px}
@media(max-width:1000px){.mother-v17{height:calc(100vh - 132px)}.cup-entry-row{grid-template-columns:1fr 1fr}.cup-entry-row .btn{grid-column:1/-1}}
@media(max-width:680px){.mother-v17{height:auto;min-height:0;overflow:visible}.mother-v17 .mother-stock-scroll{max-height:62vh}.cup-entry-row{grid-template-columns:1fr}.cup-entry-row .btn{grid-column:auto}.note-legend{white-space:normal;flex-wrap:wrap}}

<script>
(() => {
  'use strict';
  const H_DEFS=[
    {id:'H1',label:'H1 · FYERS',broker:'Fyers'},
    {id:'H2',label:'H2 · ZERODHA',broker:'Zerodha'},
    {id:'H3',label:'H3 · ICICI',broker:'ICICI'},
    {id:'H4',label:'H4 · OTHER',broker:'Other'}
  ];

  function ensureV17State(){
    state.cupManual = state.cupManual && typeof state.cupManual==='object' ? state.cupManual : {};
    state.cupIgnore = state.cupIgnore && typeof state.cupIgnore==='object' ? state.cupIgnore : {};
    state.tradeDrafts = state.tradeDrafts && typeof state.tradeDrafts==='object' ? state.tradeDrafts : {};
    state.appVersion='1.7';
  }
  function watchDefs17(){
    const defs=Array.isArray(state.watchDefs)&&state.watchDefs.length?state.watchDefs:[1,2,3,4,5].map(n=>({id:'W'+String(n).padStart(2,'0'),label:'W'+String(n).padStart(2,'0')}));
    return defs.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  }
  function watchOptions17(current,placeholder='—'){
    return `<option value="">${esc(placeholder)}</option>`+watchDefs17().map(w=>`<option value="${esc(w.id)}" ${current===w.id?'selected':''}>${esc(w.label||w.id)}</option>`).join('')+`<option class="cup-manual-option184" value="__CUP__">CUP (Manual)</option>`;
  }
  function tradeDraft17(symbol){return state.tradeDrafts?.[symbol]||null}
  function isTraded17(symbol){return tradeDraft17(symbol)?.traded==='YES'}
  function holdingFolder17(symbol){
    const t=tradeDraft17(symbol); if(!t||t.traded!=='YES'||t.lastExitDate)return '';
    const b=String(t.broker||'').toLowerCase();
    if(b==='fyers')return'H1';if(b==='zerodha')return'H2';if(b==='icici')return'H3';return'H4';
  }
  function tradeBadge17(symbol){
    if(!isTraded17(symbol))return'';const h=holdingFolder17(symbol);return `<span class="badge traded">TRADED</span>${h?`<span class="badge holding">${h}</span>`:''}`;
  }
  function plainObsText(v){
    const d=document.createElement('div');d.innerHTML=String(v||'');return (d.textContent||'').trim();
  }
  function hasObservation17(symbol){
    const o=state.observations?.[symbol];if(!o)return false;return ['overall','m','w','d','h','special'].some(k=>plainObsText(o[k]));
  }
  function latestScanTime17(symbol){
    let best=0;for(const run of state.runs||[]){if(!(state.records||[]).some(r=>r.runId===run.id&&r.symbol===symbol))continue;const raw=run.importedAt||`${run.date}T12:00:00`;const t=Date.parse(raw);if(Number.isFinite(t)&&t>best)best=t}return best;
  }
  function noteState17(symbol){
    if(!hasObservation17(symbol))return'';const o=state.observations[symbol]||{};const u=Date.parse(o.updatedAt||'')||0;const s=latestScanTime17(symbol);if(s)return u>=s?'new':'past';
    if(!u)return'past';const d=new Date(u),n=new Date();return d.toDateString()===n.toDateString()?'new':'past';
  }
  window.noteBullet17=function(symbol){const n=noteState17(symbol);if(!n)return'';const title=n==='new'?'New / updated observation after latest scan':'Past observation from before latest scan';return `<span class="note-dot ${n}" title="${title}"></span>`}
  function manualCup17(symbol){return !!state.cupManual?.[symbol]?.active}
  function ignoredCup17(symbol){return !!state.cupIgnore?.[symbol]}
  function manualCupBadge17(symbol){return manualCup17(symbol)?`<span class="badge cupwatch" onclick="event.stopPropagation();setMain('cup')">CUP WATCH</span>`:''}

  // Rename visible Cup section; internal registry values stay untouched for history compatibility.
  try{const x=MAIN_TABS.find(x=>x[0]==='cup');if(x)x[1]='CUP SCAN'}catch(e){}

  window.symbolMap=function(){
    ensureV17State();const m={};(state.records||[]).forEach(r=>{m[r.symbol]={symbol:r.symbol,name:r.name||r.symbol}});Object.entries(state.cupManual||{}).forEach(([s,x])=>{if(x?.active)m[s]={symbol:s,name:x.name||m[s]?.name||s}});return m;
  };
  window.activeTagsFor=function(symbol){
    ensureV17State();const out=[];Object.keys(state.registry||{}).forEach(code=>{if(code.startsWith('4')&&ignoredCup17(symbol))return;const lr=latestRun(code);if(lr&&recordsForRun(lr.id).some(r=>r.symbol===symbol))out.push(code)});return out.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  };
  window.keptTagsFor=function(symbol){
    ensureV17State();const out=[];Object.keys(state.registry||{}).forEach(code=>{if(code.startsWith('4')&&ignoredCup17(symbol))return;const lr=latestRun(code);if(!lr)return;const d=droppedForRun(code,lr).find(x=>x.symbol===symbol);if(d){const dec=state.dropDecisions[decisionKey(code,symbol,lr.id)];if(dec&&dec.action==='KEEP')out.push(code)}});return out.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  };
  window.currentUniverse=function(){
    ensureV17State();const sm=symbolMap(),syms=new Set();
    Object.keys(state.registry||{}).forEach(code=>{const lr=latestRun(code);if(lr)recordsForRun(lr.id).forEach(r=>syms.add(r.symbol))});
    Object.keys(state.registry||{}).forEach(code=>{const lr=latestRun(code);if(!lr)return;droppedForRun(code,lr).forEach(d=>{const dec=state.dropDecisions[decisionKey(code,d.symbol,lr.id)];if(dec&&dec.action==='KEEP')syms.add(d.symbol)})});
    Object.keys(state.watchlists||{}).forEach(s=>{if(state.watchlists[s])syms.add(s)});
    Object.entries(state.cupManual||{}).forEach(([s,x])=>{if(x?.active)syms.add(s)});
    Object.keys(state.tradeDrafts||{}).forEach(s=>{if(isTraded17(s))syms.add(s)});
    return [...syms].map(symbol=>{
      const active=activeTagsFor(symbol),kept=keptTagsFor(symbol),recs=(state.records||[]).filter(r=>r.symbol===symbol),dates=recs.map(r=>r.date).filter(Boolean).sort(),statuses=active.map(c=>{const lr=latestRun(c);return lr?statusInRun(c,lr,symbol):''});
      const manual=manualCup17(symbol),traded=isTraded17(symbol),holding=holdingFolder17(symbol);const name=(sm[symbol]||{}).name||state.cupManual?.[symbol]?.name||symbol;
      return {symbol,name,active,kept,count:active.length,cup:manual||active.some(c=>c.startsWith('4'))||kept.some(c=>c.startsWith('4')),manualCup:manual,ignoredCup:ignoredCup17(symbol),traded,holding,first:dates[0]||'',last:dates[dates.length-1]||state.cupManual?.[symbol]?.addedAt?.slice(0,10)||'',newFlag:statuses.includes('NEW'),reFlag:statuses.includes('RE-ENTRY'),rating:state.ratings?.[symbol]||0,watch:state.watchlists?.[symbol]||'',noteState:noteState17(symbol)};
    }).filter(x=>x.active.length||x.kept.length||x.watch||x.manualCup||x.traded).sort((a,b)=>(b.count-a.count)||Number(b.traded)-Number(a.traded)||Number(b.cup)-Number(a.cup)||a.symbol.localeCompare(b.symbol));
  };

  window.motherFiltered=function(){
    let arr=currentUniverse();const f=ui.motherFilter;if(f==='MULTI')arr=arr.filter(x=>x.count>=3);if(f==='CUP')arr=arr.filter(x=>x.cup);if(f==='TRADED')arr=arr.filter(x=>x.traded);if(f==='NEW')arr=arr.filter(x=>x.newFlag);if(f==='RE')arr=arr.filter(x=>x.reFlag);if(f==='KEEP')arr=arr.filter(x=>x.kept.length);if(/^W\d+$/i.test(f))arr=arr.filter(x=>x.watch===f);if(ui.familyFilter)arr=arr.filter(x=>x.active.concat(x.kept).some(c=>registry(c).familyCode===ui.familyFilter));if(ui.search){const q=ui.search.toUpperCase();arr=arr.filter(x=>x.symbol.includes(q)||x.name.toUpperCase().includes(q))}return arr;
  };
  window.renderMother=function(){

  function scannerCodes17(tf){return Object.keys(state.registry||{}).filter(c=>{const t=String(state.registry[c]?.timeframe||'').toLowerCase();if(tf==='daily')return t.startsWith('daily');if(tf==='weekly')return t.startsWith('weekly');if(tf==='monthly')return t.startsWith('monthly');return !t.startsWith('daily')&&!t.startsWith('weekly')&&!t.startsWith('monthly')}).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))}
  window.renderScannerPage=function(tf){

et17(r.symbol)}</b><span>${statusBadge(statusInRun(code,run,r.symbol))}${tradeBadge17(r.symbol)}${ig?'<span class="badge ignored">IGNORED</span>':''}</span></div><div class="nm">${esc(r.name)}</div><div class="muted">Close ${numFmt(r.close)} · M ${numFmt(r.mRsi)} / W ${numFmt(r.wRsi)} / D ${numFmt(r.dRsi)}</div>${tf==='cup'?`<div class="cup-decision" onclick="event.stopPropagation();"><span>Ignore</span><select onchange="setCupIgnore17('${r.symbol}',this.value==='YES')"><option value="NO" ${!ig?'selected':''}>No</option><option value="YES" ${ig?'selected':''}>Yes</option></select></div>`:''}</div>`}).join('')||'<div class="empty">Confirmed run: no stocks found.</div>'):'<div class="empty">No run imported yet.</div>'}</div>${dropped.length?renderDropped(code,run,dropped):''}`;

  function hArray17(id){return currentUniverse().filter(x=>x.holding===id)}

  window.exportFyersFolder17=function(id){let arr;if(/^H\d$/i.test(id))arr=hArray17(id);else if(id==='ALL')arr=currentUniverse().filter(x=>x.watch);else arr=currentUniverse().filter(x=>x.watch===id);if(!arr.length)return toast('No stocks in this folder');dl17(`FYERS_${id}_${new Date().toISOString().slice(0,10)}.txt`,fyersText17(arr.map(x=>x.symbol)));toast(`${arr.length} stocks exported for FYERS`)};

  ensureV17State();saveState();
  document.title='TRINETRA Scanner Dashboard · v1.7 Portable Sync';

  function findCol181(headers,aliases){const h=headers.map(key181);for(const a of aliases){const i=h.indexOf(key181(a));if(i>=0)return i}return -1}
  function date181(v){v=String(v||'').trim();if(!v)return'';let m=v.match(/^(\d{1,2})[-\/]([A-Za-z]{3})[-\/](\d{2,4})$/);if(m){const mon={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12}[m[2].toLowerCase()];let y=Number(m[3]);if(y<100)y+=2000;if(mon)return `${y}-${String(mon).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`};m=v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);if(m){let y=Number(m[3]);if(y<100)y+=2000;return `${y}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`};const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10)}

<!-- TRINETRA v1.8.20 — Generic Mother row-action scroll anchor -->
<script>
(() => {
  'use strict';
  const V='1.8.20';
  let pending=null;
  let restoring=false;

  const norm=s=>String(s||'').trim().toUpperCase().replace(/^NSE:/,'').replace(/-EQ$/,'');
  const visible=el=>!!(el && (el.offsetWidth||el.offsetHeight||el.getClientRects().length));

  function rowSymbol(row){
    if(!row)return '';
    const byData=row.querySelector?.('[data-watch-symbol]')?.getAttribute?.('data-watch-symbol');
    if(byData)return norm(byData);
    const sym=row.querySelector?.('.symbol');
    if(sym){
      const raw=(sym.childNodes?.[0]?.textContent||sym.textContent||'').trim();
      if(raw)return norm(raw.split(/\s+/)[0]);
    }
    const b=row.querySelector?.('.top > b:first-child, :scope > b:first-child');
    if(b){
      const raw=(b.childNodes?.[0]?.textContent||b.textContent||'').trim();
      if(raw)return norm(raw.split(/\s+/)[0]);
    }
    return '';
  }

  function captureFromTarget(target){
    if(restoring||!target?.closest)return;
    if(typeof ui==='undefined'||ui.main!=='mother')return;
    const scroller=target.closest('.mother-v17 .mother-stock-scroll');
    if(!scroller)return;
    // Only controls that edit the current row. Do not anchor scanner-tag/navigation clicks.
    const control=target.closest('select,button,.star,input[type="checkbox"],input[type="radio"]');
    if(!control||!scroller.contains(control))return;
    const row=control.closest('tr,.stockcard');
    if(!row)return;
    const sr=scroller.getBoundingClientRect(), rr=row.getBoundingClientRect();
    pending={
      main:ui.main,
      filter:ui.motherFilter,
      tf:ui.motherActivityTf,
      symbol:rowSymbol(row),
      mobile:scroller.classList.contains('mobile-card'),
      top:scroller.scrollTop,
      left:scroller.scrollLeft,
      rowOffset:rr.top-sr.top,
      winX:window.scrollX||0,
      winY:window.scrollY||0,
      at:Date.now()
    };
  }

  function targetScroller(snap){
    const q=snap.mobile?'.mother-v17 .mother-stock-scroll.mobile-card':'.mother-v17 .mother-stock-scroll.desktop-table';
    return [...document.querySelectorAll(q)].find(visible)||document.querySelector(q);
  }

  function findRow(scroller,symbol){
    if(!scroller||!symbol)return null;
    const rows=[...scroller.querySelectorAll('tr,.stockcard')];
    return rows.find(r=>rowSymbol(r)===symbol)||null;
  }

  function restore(snap){
    if(!snap||typeof ui==='undefined')return;
    if(ui.main!==snap.main||ui.motherFilter!==snap.filter||(ui.motherActivityTf||'ALL')!==(snap.tf||'ALL'))return;
    const scroller=targetScroller(snap);
    if(!scroller)return;
    restoring=true;
    try{
      scroller.scrollTop=snap.top;
      scroller.scrollLeft=snap.left;
      const row=findRow(scroller,snap.symbol);
      if(row&&snap.rowOffset!=null){
        const sr=scroller.getBoundingClientRect(), rr=row.getBoundingClientRect();

      }
      if(Math.abs((window.scrollY||0)-snap.winY)>1||Math.abs((window.scrollX||0)-snap.winX)>1){
        window.scrollTo(snap.winX,snap.winY);
      }
    }finally{restoring=false}
  }

  document.addEventListener('keydown',e=>{

  if(typeof base==='function')window.render=function(){
    const snap=pending && (Date.now()-pending.at<2500)?{...pending}:null;
    const r=base.apply(this,arguments);
    if(snap){
      requestAnimationFrame(()=>requestAnimationFrame(()=>restore(snap)));
      setTimeout(()=>restore(snap),70);
      setTimeout(()=>{if(pending&&pending.at===snap.at)pending=null},180);
    }
    return r;
  };
  try{render=window.render}catch(e){}

  function identity(){
    try{state.appVersion=V}catch(e){}
    document.title='TRINETRA — For Long Trades · v'+V;
    const s=document.querySelector('.subbrand');
    if(s)s.textContent="Neel's Trading Universe · v"+V+' Portable Sync';
  }

})();
</script>

<script>

  // This patch is intentionally isolated and does not replace Jui analysis, P&L logic,

  const PATCH_KEY = 'tradeReopen1825Fixed';

  const baseRenderJournal = window.renderTradeJournal18;
  const baseRenderAnalysis = window.renderTradeAnalysis18;
  const baseJournalSearch = window.journalSearch182;
  const baseAnalysisSearch = window.analysisSearch18;

  if (typeof baseRenderJournal !== 'function' ||
      typeof baseRenderAnalysis !== 'function' ||

  function cycles() {
    return Object.values(state.tradeCycles || {}).filter(Boolean);
  }

  function activeTransactions(c) {
    return (c && Array.isArray(c.transactions) ? c.transactions : []).filter(t => !t.deleted);
  }

  function side(t) {
    return /SELL|EXIT/i.test(String((t && (t.side || t.action)) || '')) ? 'SELL' : 'BUY';
  }

  // IMPORTANT: this status rule mirrors the verified v1.8.24 metrics182/metrics18 close rule.
  function statusOf(c) {
    let qty = 0, buyCount = 0, sellCount = 0;
    for (const t of activeTransactions(c)) {
      const q = Math.abs(Number(t.qty) || 0);
      const p = Number(t.price) || 0;
      if (!q || !p) continue;
      if (side(t) === 'BUY') {
        buyCount++;
        qty += q;
      } else {
        sellCount++;
        qty = Math.max(0, qty - Math.min(q, qty));
      }
    }
    const has = buyCount + sellCount > 0;
    if (c.archivedTradeId || c.forcedClosed || (c.lastExitDate && c.outcome)) return 'CLOSED';
    if (has && qty <= 1e-8 && sellCount > 0) return 'CLOSED';
    if (sellCount > 0 && qty > 0) return 'PARTIAL';
    if (c.traded === 'YES' || buyCount > 0) return 'OPEN';
    return 'DRAFT';
  }

  function reopenMap(create) {
    if (!state[PATCH_KEY] && create) state[PATCH_KEY] = {};

    if (!c || statusOf(c) !== 'CLOSED') {

      });

      if (!tbody.querySelector('tr')) {
        tbody.innerHTML = '<tr><td colspan="12" class="empty">No active trade cycles. Closed cycles are in Trade Analysis.</td></tr>';
      }
    }

    const all = cycles();
    const closed = all.filter(c => statusOf(c) === 'CLOSED' && !isReopened(c.id));
    const active = all.filter(c => statusOf(c) !== 'CLOSED' || isReopened(c.id));
    const reviewed = closed.filter(c => state.tradeAnalyses && state.tradeAnalyses[c.id] && state.tradeAnalyses[c.id].status === 'Reviewed').length;

    setKpi(root, 'ALL CYCLES', active.length, 'ACTIVE CYCLES');
    setKpi(root, 'OPEN', active.filter(c => statusOf(c) === 'OPEN').length);
    setKpi(root, 'PARTIAL EXIT', active.filter(c => statusOf(c) === 'PARTIAL').length);

  function processAnalysisRoot(root) {
    const tbody = root.querySelector('#analysisRows18') || root.querySelector('table tbody');

      Array.from(tbody.querySelectorAll('tr')).forEach(row => {

    const closed = closedCyclesVisibleInAnalysis();
    const reviewed = closed.filter(c => state.tradeAnalyses && state.tradeAnalyses[c.id] && state.tradeAnalyses[c.id].status === 'Reviewed').length;
    const pyramid = closed.filter(c => activeTransactions(c).filter(t => side(t) === 'BUY').length > 1).length;

    setKpi(root, 'COMPLETED CYCLES', closed.length);

  function postProcessCurrentDom() {

  window.renderTradeJournal18 = function() {
