        const head = dlg.querySelector('.dialog-head');
        if (head && !head.querySelector('.v1825f-reclose')) {

          b.className = 'btn small v1825f-reclose';
          b.textContent = 'Re-close';

          if (closeBtn) head.insertBefore(b, closeBtn);
          else head.appendChild(b);

      }

    return r;
  };

  window.undoClosed1825Fixed = function(id) {
    const c = state.tradeCycles && state.tradeCycles[id];
    if (!c) {
      if (typeof toast === 'function') toast('Trade cycle not found');
      return;
    }
    if (statusOf(c) !== 'CLOSED') {
      if (typeof toast === 'function') toast('This cycle is not closed');
      return;
    }

    const ok = confirm(
      'Undo Closed for ' + (c.symbol || 'this trade') + '?\n\n' +
      'The same cycle will return to Trade Journal. No BUY/SELL transaction will be deleted. ' +
      'If the final exit was entered by mistake, correct or remove that transaction in the Journal.'
    );
    if (!ok) return;

    const m = reopenMap(true);
    m[id] = { reopened: true, at: new Date().toISOString(), symbol: c.symbol || '' };
    if (typeof saveState === 'function') saveState();

    try { document.getElementById('analysisModal18')?.classList.remove('show'); } catch (e) {}
    if (ui) {
      ui.main = 'journal';

    setTimeout(() => {

  ['portableReloadLatest', 'restoreBackup'].forEach(fn => {

  if (typeof render === 'function') render();
})();

  if(q<=1e-8&&sells) return 'CLOSED'; if(sells&&q>0) return 'PARTIAL'; if(c?.traded==='YES'||txs26(c).some(t=>side26(t)==='BUY'))return 'OPEN'; return 'DRAFT';
}
function events26(c){ return Array.isArray(c?.tradeEvents)?c.tradeEvents:[]; }

function finance26(c){
  let qty=0,avg=0,gross=0,totalBuy=0,totalSell=0,ledgerCharges=0,peak=0,buyCount=0,sellCount=0,maxQty=0;
  const timeline=[];
  for(const t of txs26(c)){
    const q=Math.abs(Number(t.qty)||0), p=Number(t.price)||0, ch=Math.abs(Number(t.charges)||0); ledgerCharges+=ch;
    if(!q||!p) continue;
    if(side26(t)==='BUY'){
      buyCount++; totalBuy+=q*p; avg=qty?((avg*qty)+(q*p))/(qty+q):p; qty+=q; maxQty=Math.max(maxQty,qty);
    }else{
      sellCount++; totalSell+=q*p; const used=Math.min(q,qty); gross+=(p-avg)*used; qty=Math.max(0,qty-used); if(qty<=1e-8){qty=0;avg=0;}
    }
    const deployed=qty*avg; peak=Math.max(peak,deployed);
    timeline.push({t,qtyAfter:qty,deployedAfter:deployed});
  }
  const autoCharge=(ledgerCharges>0?null:(typeof window.trinetraAutoCharges1827d==='function'?window.trinetraAutoCharges1827d(c):null));
  const autoRegular=Math.abs(Number(autoCharge?.regular)||0);
  const extra=Math.abs(Number(c?.regularChargesExtra)||0), regular=ledgerCharges+autoRegular+extra;
  let mtfManual=0, mtfMissing=0, mtfEvents=0;
  for(const e of events26(c)) if(String(e.mtf||'').toUpperCase()==='YES'){
    mtfEvents++; const x=Number(e.mtfCharges); if(Number.isFinite(x)&&x>0)mtfManual+=Math.abs(x); else mtfMissing++;
  }
  const mtfAuto=(mtfEvents&&mtfManual<=0&&typeof window.trinetraMtfEstimate1827e==='function')?window.trinetraMtfEstimate1827e(c):null;
  const mtf=mtfManual>0?mtfManual:Math.abs(Number(mtfAuto?.total)||0);
  const mtfPending=mtfManual>0?0:(mtfAuto?0:mtfMissing);
  const net=gross-regular-mtf, grossPctPeak=peak?gross/peak*100:null, netPctPeak=peak?net/peak*100:null;
  const dates=txs26(c).map(t=>t.date).filter(Boolean).sort(), start=dates[0]||c?.initialEntryDate||'', close=(status26(c)==='CLOSED'?(dates[dates.length-1]||c?.lastExitDate||''):'');
  let days=null; if(start&&close){const a=new Date(start+'T00:00:00'),b=new Date(close+'T00:00:00'); if(!isNaN(a)&&!isNaN(b))days=Math.round((b-a)/86400000);}
  return {qty,avg,gross,totalBuy,totalSell,ledgerCharges,autoRegular,autoCharge,extra,regular,mtf,mtfManual,mtfAuto,mtfPending,net,peak,grossPctPeak,netPctPeak,buyCount,sellCount,maxQty,start,close,days,timeline};
}

function groupTx26(c){
  const groups=[]; const map=new Map();
  for(const t of txs26(c)){

    if(!map.has(key)){const g={key,typ,date:t.date||'',time:tm,txs:[]};map.set(key,g);groups.push(g);} map.get(key).txs.push(t);
  }
  return groups;
}
function execSummary26(rows){
  const a=rows||[], qty=a.reduce((s,t)=>s+Math.abs(Number(t.qty)||0),0), val=a.reduce((s,t)=>s+Math.abs(Number(t.qty)||0)*(Number(t.price)||0),0);
  return {qty,avg:qty?val/qty:0,val};
}
function decisionItems26(c){
  const ev=events26(c).map(e=>({key:'EV:'+e.id,source:'event',ref:e.id,type:e.type||'',date:e.date||'',time:'',broker:e.broker||'',reason:e.reason||'',chartIds:[...(e.chartIds||[])],txs:[]}));
  const groups=groupTx26(c), used=new Set();
  for(const g of groups){
    let ix=ev.findIndex((x,i)=>!used.has(i)&&x.type===g.typ&&(!x.date||!g.date||x.date===g.date));
    if(ix>=0){ev[ix].txs.push(...g.txs); if(!ev[ix].date)ev[ix].date=g.date; if(!ev[ix].time)ev[ix].time=g.time; for(const t of g.txs)if(t.chartId&&!ev[ix].chartIds.includes(t.chartId))ev[ix].chartIds.push(t.chartId); used.add(ix);}
    else ev.push({key:'TXG:'+g.key,source:'txgroup',ref:g.key,type:g.typ,date:g.date,time:g.time,broker:g.txs[0]?.broker||'',reason:g.txs.map(t=>t.note||'').filter(Boolean).join(' | '),chartIds:g.txs.map(t=>t.chartId).filter(Boolean),txs:g.txs});
  }
  const order={'Initial Entry':0,'Pyramid/Add':1,'Partial Exit':2,'Final Exit':3};
  let out=ev.filter(x=>x.type);
  const pendingKey='PENDING:FINAL_EXIT', actualFinal=out.find(x=>x.type==='Final Exit');
  if(actualFinal){
    const sm=c[DKEY26]&&typeof c[DKEY26]==='object'?c[DKEY26]:null;
    if(sm&&sm[pendingKey]&&!sm[actualFinal.key]){
      sm[actualFinal.key]=sm[pendingKey];

    }
  }else{
    out.push({key:pendingKey,source:'pending',ref:'FINAL_EXIT',type:'Final Exit',date:'',time:'',broker:c.broker||'',reason:'Fill this when the final-exit decision is being taken.',chartIds:[],txs:[],pending:true});

}

function cellVerdict26(field,val){
  const v=String(val||'').trim(); if(!v) return '<span class="v26-v neutral">Not recorded</span>';
  if(field==='htfSupport'||field==='thesisValid'||field==='exitPlan'){
    if(v==='YES')return '<span class="v26-v good">Supportive</span>'; if(v==='PARTIAL')return '<span class="v26-v warn">Caution</span>'; if(v==='NO')return '<span class="v26-v bad">Negative</span>';
  }
  if(/Align$/.test(field)){
    if(v==='Strong')return '<span class="v26-v good">Strong</span>'; if(v==='Acceptable')return '<span class="v26-v good">Supportive</span>'; if(v==='Mixed')return '<span class="v26-v warn">Mixed</span>'; if(v==='Poor')return '<span class="v26-v bad">Weak</span>';
  }
  if(field==='ltfState'){
    if(/Resolving|Aligned/.test(v))return '<span class="v26-v good">Favourable</span>';
    if(v==='Range')return '<span class="v26-v neutral">Range / consolidation</span>';
    if(/Extended/.test(v))return '<span class="v26-v warn">Extension risk</span>';
    if(/Weak/.test(v))return '<span class="v26-v bad">Weak</span>';
    return '<span class="v26-v neutral">Context</span>';
  }
  if(field==='resistanceNearby'){
    if(v==='YES')return '<span class="v26-v warn">Overhead risk</span>'; if(v==='NO')return '<span class="v26-v good">Clearer path</span>'; return '<span class="v26-v neutral">Review chart</span>';
  }
  if(field==='riskWithinPlan') return v==='YES'?'<span class="v26-v good">Controlled</span>':'<span class="v26-v bad">Risk issue</span>';
  if(field==='positionExtended') return v==='YES'?'<span class="v26-v warn">Extension risk</span>':'<span class="v26-v good">Not extended</span>';
  if(field==='thesisNow') return v==='STRONGER'?'<span class="v26-v good">Improved</span>':v==='WEAKER'?'<span class="v26-v warn">Deteriorating</span>':'<span class="v26-v neutral">Unchanged</span>';
  if(field==='thesisInvalidated') return v==='YES'?'<span class="v26-v good">Clear invalidation</span>':v==='NO'?'<span class="v26-v warn">Risk/discretion exit</span>':'<span class="v26-v neutral">Partial invalidation</span>';
  if(field==='slRevised') return v==='YES'?'<span class="v26-v good">Risk updated</span>':'<span class="v26-v neutral">No revision</span>';
  if(['invalidation','whyNow','whyKeep','remainExitCondition','revisedSL','ltfNote'].includes(field)) return v?'<span class="v26-v good">Documented</span>':'<span class="v26-v warn">Missing</span>';
  if(/Discrepancy|discrepancy/i.test(field)) return v?'<span class="v26-v warn">Review noted</span>':'<span class="v26-v good">None noted</span>';
  return '<span class="v26-v neutral">Recorded</span>';
}
function overallVerdict26(type,d){
  let score=0,n=0; const add=(v)=>{if(v==null)return;score+=v;n++;};
  const al=v=>v==='Strong'?2:v==='Acceptable'?1:v==='Mixed'?0:v==='Poor'?-2:null;
  const yp=v=>v==='YES'?2:v==='PARTIAL'?0:v==='NO'?-2:null;
  if(type==='Initial Entry'){
    add(yp(d.htfSupport)); add(al(d.maAlign)); add(al(d.rsiAlign)); add(al(d.macdAlign));
    add(d.ltfState==='Resolving Correction'||d.ltfState==='Aligned & Moving'?1:d.ltfState==='Extended'?-1:d.ltfState==='Weak'?-2:null);
    add(d.resistanceNearby==='YES'?-1:d.resistanceNearby==='NO'?1:null); add(d.whyNow?1:null); add(d.invalidation?1:null);
  }else if(type==='Pyramid/Add'){
    add(yp(d.htfSupport)); add(al(d.maAlign)); add(al(d.rsiAlign)); add(al(d.macdAlign)); add(d.thesisNow==='STRONGER'?2:d.thesisNow==='SAME'?0:d.thesisNow==='WEAKER'?-2:null); add(d.riskWithinPlan==='YES'?2:d.riskWithinPlan==='NO'?-3:null); add(d.positionExtended==='YES'?-1:d.positionExtended==='NO'?1:null);
  }else if(type==='Partial Exit'){
    add(yp(d.htfSupport)); add(al(d.maAlign)); add(al(d.rsiAlign)); add(al(d.macdAlign)); add(d.exitReason?1:null); add(d.thesisValid==='YES'?0:d.thesisValid==='PARTIAL'?1:d.thesisValid==='NO'?2:null); add(d.whyKeep?1:null); add(d.remainExitCondition?1:null);
  }else{
    add(yp(d.exitPlan)); add(al(d.maAlign)); add(al(d.rsiAlign)); add(al(d.macdAlign)); add(d.finalExitReason?1:null); add(d.thesisInvalidated==='YES'?2:d.thesisInvalidated==='NOT FULLY — exited for risk'?1:d.thesisInvalidated==='NO'?0:null);
  }
  if(n<3) return {label:'Insufficient journal data',cls:'neutral',score:null};
  const a=score/n; if(a>=1.05)return {label:'Strong / well-supported decision',cls:'good',score:a}; if(a>=0.25)return {label:'Valid with caution',cls:'warn',score:a}; if(a>-0.6)return {label:'Mixed — review chart context',cls:'warn',score:a}; return {label:'Weak / process concern',cls:'bad',score:a};
}

function reportEsc26(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function reportText26(v){const s=String(v??'').trim();return s?reportEsc26(s).replace(/\n/g,'<br>'):'<span class="empty">—</span>';}
function reportScore26(v){return String(v??'').trim()?reportEsc26(v):'—';}
function reportBroker26(c){const a=[...new Set(txs26(c).map(t=>String(t.broker||'').trim()).filter(Boolean))];return a.length?a.join(', '):(c.broker||'—');}
function reportFileName26(c){const raw=`TRINETRA_${c.symbol||'TRADE'}_CYCLE_${String(reportCycleNo26(c)).padStart(2,'0')}_Trade_Report`;return raw.replace(/_+/g,'_');}
function reportCycleNo26(c){const all=Object.values(state.tradeCycles||{}).filter(x=>x&&x.symbol===c.symbol).sort((a,b)=>String(a.initialEntryDate||a.createdAt||'').localeCompare(String(b.initialEntryDate||b.createdAt||'')));const n=all.findIndex(x=>x.id===c.id);return Math.max(1,n+1);}
function reportCycleLabel26(c){return `${c.symbol||'TRADE'} · Cycle ${String(reportCycleNo26(c)).padStart(2,'0')}`;}

function reportLedgerRows26(c){
  let qty=0,avg=0;
  const rows=[];
  for(const t of txs26(c)){
    const q=Math.abs(Number(t.qty)||0),p=Number(t.price)||0,side=side26(t);
    let realized=null;
    if(side==='BUY'){
      avg=qty?((avg*qty)+(q*p))/(qty+q):p; qty+=q;
    }else{
      const used=Math.min(q,qty);realized=(p-avg)*used;qty=Math.max(0,qty-used);if(qty<=1e-8){qty=0;avg=0;}
    }
    rows.push({action:type26(t),date:t.date||'',time:t.time||'',broker:t.broker||'',qty:q,price:p,value:q*p,realized,qtyAfter:qty,charges:Math.abs(Number(t.charges)||0)});
  }
  return rows;
}
function reportDecisionGross26(item){
  let qty=0,avg=0,gross=0,hasSell=false;
  for(const t of (item.txs||[])){
    const q=Math.abs(Number(t.qty)||0),p=Number(t.price)||0;
    if(side26(t)==='BUY'){avg=qty?((avg*qty)+(q*p))/(qty+q):p;qty+=q;}
    else{hasSell=true;const used=Math.min(q,qty);gross+=(p-avg)*used;qty=Math.max(0,qty-used);if(qty<=1e-8){qty=0;avg=0;}}
  }
  if(!hasSell){
    const e=execSummary26(item.txs||[]);return {qty:e.qty,avg:e.avg,value:e.val,gross:null};
  }
  const e=execSummary26(item.txs||[]);return {qty:e.qty,avg:e.avg,value:e.val,gross};
}

    <table class="qa"><thead><tr><th>Decision Log Question</th><th>Your Input</th></tr></thead><tbody>${qa}</tbody></table>
    <div class="charts">${charts||'<div class="no-chart">No chart linked to this decision.</div>'}</div>

window.generateTradePdfReport1827m=async function(id){
  const c=cycle26(id);if(!c)return toast('Trade cycle not found');
  const w=window.open('','_blank');
  if(!w){alert('Chrome blocked the report window. Allow pop-ups for this local TRINETRA file and try again.');return;}
  w.document.write('<!doctype html><html><head><title>Preparing TRINETRA Report...</title></head><body style="font-family:Arial;padding:30px"><h2>Preparing full trade report...</h2><p>Loading Decision Log, analysis and saved charts.</p></body></html>');w.document.close();
  try{
    let all=[];try{if(typeof idbAll==='function')all=await idbAll();}catch(e){console.warn(e);}
    const mp=new Map((all||[]).map(x=>[x.id,x]));
    const items=labelItems26(decisionItems26(c)).filter(x=>!x.pending);
    const ids=[...new Set(items.flatMap(x=>x.chartIds||[]).filter(Boolean))];
    const missing=ids.filter(id=>!mp.get(id)?.data).length;
    const html=reportHtml26(c,mp,missing);

  }
};

<script>

(function(){
'use strict';
const V27D='1.8.27d';

function n27d(v){const x=Number(v);return Number.isFinite(x)?x:0}
function esc27d(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money27d(v){return '₹'+n27d(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function txs27d(c){return (c?.transactions||[]).filter(t=>!t.deleted).slice().sort((a,b)=>`${a.date||''}T${a.time||''}`.localeCompare(`${b.date||''}T${b.time||''}`))}
function side27d(t){return /SELL|EXIT/i.test(String(t?.side||t?.action||''))?'SELL':'BUY'}
function events27d(c){return Array.isArray(c?.tradeEvents)?c.tradeEvents:[]}
function hasMtf27d(c){return events27d(c).some(e=>String(e?.mtf||'').toUpperCase()==='YES')}
function orderCount27d(rows){
  const keys=new Set();
  rows.forEach((t,i)=>{
    const k=String(t.orderId||'').trim();
    keys.add(k||`ROW:${i}`);
  });
  return keys.size;
}
function statutory27d(rows, broker, mtf){
  const buy=rows.filter(t=>side27d(t)==='BUY').reduce((s,t)=>s+Math.abs(n27d(t.qty))*n27d(t.price),0);
  const sell=rows.filter(t=>side27d(t)==='SELL').reduce((s,t)=>s+Math.abs(n27d(t.qty))*n27d(t.price),0);
  const turnover=buy+sell;
  if(!turnover)return {regular:0,breakdown:{}};

  const exchange=turnover*0.0000307;       // NSE equity cash 0.00307%
  const sebi=turnover*0.000001;            // ₹10/crore
  const stt=(buy+sell)*0.001;               // delivery/MTF equity 0.1% both sides
  const stamp=buy*0.00015;                  // delivery/MTF buy side 0.015%

  let brokerage=0, dp=0, note='', supported=true;
  const b=String(broker||'').toUpperCase();

  if(b.includes('ZERODHA')){
    if(mtf){
      // ₹20 or 0.3% per executed MTF order, whichever is lower.
      const grouped=new Map();
      rows.forEach((t,i)=>{
        const k=String(t.orderId||'').trim()||`ROW:${i}`;
        grouped.set(k,(grouped.get(k)||0)+Math.abs(n27d(t.qty))*n27d(t.price));
      });
      brokerage=[...grouped.values()].reduce((s,v)=>s+Math.min(20,v*0.003),0);
    }
    // Delivery brokerage is zero.
    const sellDays=new Set(rows.filter(t=>side27d(t)==='SELL'&&t.date).map(t=>t.date));
    const dpProfile=String(state?.brokerChargeSettings?.zerodhaDpHolder||'FEMALE').toUpperCase();
    const dpPerDay=dpProfile==='MALE'?15.34:15.05;
    dp=sellDays.size*dpPerDay;
    note='Zerodha NSE '+(mtf?'MTF':'delivery')+' estimate; DP profile '+dpProfile+' ('+money27d(dpPerDay)+' per sell-day/scrip).';
  }else if(b.includes('FYERS')){
    // FYERS delivery/MTF: ₹20 or 0.3% per executed order, whichever lower.
    const grouped=new Map();
    rows.forEach((t,i)=>{
      const k=String(t.orderId||'').trim()||`ROW:${i}`;
      grouped.set(k,(grouped.get(k)||0)+Math.abs(n27d(t.qty))*n27d(t.price));
    });
    brokerage=[...grouped.values()].reduce((s,v)=>s+Math.min(20,v*0.003),0);
    const sellDays=new Set(rows.filter(t=>side27d(t)==='SELL'&&t.date).map(t=>t.date));
    dp=sellDays.size*(12.5*1.18);
    note='FYERS NSE delivery estimate.';
  }else{
    supported=false;
    note='Auto charge profile not configured for this broker.';

<script>

(function(){
'use strict';
const V27E='1.8.27e';

function nE(v){const x=Number(v);return Number.isFinite(x)?x:0}
function escE(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function moneyE(v){return '₹'+nE(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pctE(v){return nE(v).toFixed(3)+'%'}
function rowsE(c){return (c?.transactions||[]).filter(t=>!t.deleted).slice().sort((a,b)=>`${a.date||''}T${a.time||''}`.localeCompare(`${b.date||''}T${b.time||''}`))}
function sideE(t){return /SELL|EXIT/i.test(String(t?.side||t?.action||''))?'SELL':'BUY'}
function evsE(c){return Array.isArray(c?.tradeEvents)?c.tradeEvents:[]}
function mtfE(c){return String(c?.broker||'').toUpperCase().includes('ZERODHA')&&evsE(c).some(e=>String(e?.mtf||'').toUpperCase()==='YES')}
function groupOrdersE(rows){
  const mp=new Map();
  rows.forEach((t,i)=>{
    const explicit=String(t.orderId||t.orderID||t.orderNo||t.brokerOrderId||'').trim();
    const fallback=[t.date||'',t.time||'',sideE(t),t.action||''].join('|');
    const k=explicit||fallback||('ROW:'+i);
    mp.set(k,(mp.get(k)||0)+Math.abs(nE(t.qty))*nE(t.price));
  });
  return [...mp.values()];
}
function peakE(rows){
  let qty=0,avg=0,peak=0;
  for(const t of rows){
    const q=Math.abs(nE(t.qty)),p=nE(t.price);if(!q||!p)continue;
    if(sideE(t)==='BUY'){avg=qty?((avg*qty)+(q*p))/(qty+q):p;qty+=q;}
    else{const u=Math.min(q,qty);qty=Math.max(0,qty-u);if(qty<=1e-8){qty=0;avg=0;}}
    peak=Math.max(peak,qty*avg);
  }
  return peak;
}
function brokerSettingsE(){
  state.brokerChargeSettings=state.brokerChargeSettings&&typeof state.brokerChargeSettings==='object'?state.brokerChargeSettings:{};
  if(!state.brokerChargeSettings.zerodhaDpHolder)state.brokerChargeSettings.zerodhaDpHolder='FEMALE';
  state.brokerChargeSettings.iciciPlan='PRIME9999';
  state.brokerChargeSettings.iciciCustomDeliveryPct=0.07;
  return state.brokerChargeSettings;
}
function iciciRateE(){
  brokerSettingsE();
  return 0.07; // User's lifetime ICICI Direct Prime 9999 delivery profile
}
function chargesE(c){
  const rows=rowsE(c), broker=String(c?.broker||rows.find(t=>t.broker)?.broker||'').toUpperCase();
  const buy=rows.filter(t=>sideE(t)==='BUY').reduce((s,t)=>s+Math.abs(nE(t.qty))*nE(t.price),0);
  const sell=rows.filter(t=>sideE(t)==='SELL').reduce((s,t)=>s+Math.abs(nE(t.qty))*nE(t.price),0);
  const turnover=buy+sell, peak=peakE(rows), isMtf=mtfE(c);
  if(!turnover)return {regular:0,breakdown:{supported:false,note:'No transaction turnover.'}};

  let brokerage=0,dp=0,exchangeRate=0.0000307,ipft=0,note='',profile='';
  const sellDays=new Set(rows.filter(t=>sideE(t)==='SELL'&&t.date).map(t=>t.date));

  if(broker.includes('ZERODHA')){
    if(isMtf) brokerage=groupOrdersE(rows).reduce((s,v)=>s+Math.min(20,v*0.003),0);
    const holder=String(brokerSettingsE().zerodhaDpHolder||'FEMALE').toUpperCase();
    if(!isMtf)dp=sellDays.size*(holder==='MALE'?13*1.18:12.75*1.18);
    profile=isMtf?'Zerodha MTF':'Zerodha Delivery';
    note=isMtf?'MTF brokerage + NSE statutory charges; DP excluded because MTF pledge/unpledge is shown separately.':`DP profile ${holder}.`;
  }else if(broker.includes('FYERS')){
    exchangeRate=0.000030699;
    brokerage=groupOrdersE(rows).reduce((s,v)=>s+Math.min(20,v*0.003),0);
    dp=sellDays.size*12.5*1.18;
    ipft=turnover/10000000*0.01;
    profile='FYERS Delivery';
    note='Delivery brokerage ₹20 or 0.3% per executed order, whichever is lower.';
  }else if(broker.includes('ICICI')){
    const rate=iciciRateE();
    brokerage=turnover*(rate/100);
    dp=sellDays.size*20*1.18; // CDSL-style per-scrip/day estimate; NSDL first debit is also ₹20 + GST.
    profile='ICICI Direct · '+String(brokerSettingsE().iciciPlan||'MONEYSAVER');
    note=`Delivery brokerage profile ${rate.toFixed(2)}%. DP estimated at ₹20 + GST per sell-day/scrip; actual NSDL subsequent debit instructions can differ.`;
  }else{
    return {regular:0,breakdown:{supported:false,note:'Broker auto-charge profile is not configured.'}};
  }

  const stt=(buy+sell)*0.001;                 // delivery 0.1% both sides
  const exchange=turnover*exchangeRate;       // NSE equity cash
  const sebi=turnover*0.000001;               // ₹10/crore
  const stamp=buy*0.00015;                    // 0.015% buy side
  const gst=(brokerage+exchange+sebi+ipft)*0.18;
  const regular=brokerage+stt+exchange+sebi+stamp+gst+dp+ipft;
  const pct=x=>peak?x/peak*100:0;

  return {regular,breakdown:{
    supported:true,profile,buy,sell,turnover,peak,brokerage,stt,exchange,sebi,stamp,gst,dp,ipft,
    brokeragePct:pct(brokerage),sttPct:pct(stt),exchangePct:pct(exchange),sebiPct:pct(sebi),stampPct:pct(stamp),
    gstPct:pct(gst),dpPct:pct(dp),ipftPct:pct(ipft),regularPct:pct(regular),note,isMtf
  }};
}

/* Zerodha MTF approximation: 25% own capital, 75% funded; 0.04%/calendar-day from T+1. */
window.trinetraMtfEstimate1827e=function(c){
  if(!mtfE(c))return null;
  const rows=rowsE(c);
  let qty=0,funded=0,interest=0,lastDate=null,totalBuy=0;
  const buyDates=new Set();

  for(const t of rows){
    if(!t.date)continue;
    const dt=new Date(String(t.date)+'T00:00:00');
    if(lastDate&&dt>lastDate){
      const days=Math.round((dt-lastDate)/86400000);
      interest+=funded*0.0004*days;
    }
    const q=Math.abs(nE(t.qty)),v=q*nE(t.price);
    if(sideE(t)==='BUY'){
      qty+=q; funded+=v*0.75; totalBuy+=v; buyDates.add(String(t.date));
    }else if(qty>0){
      const used=Math.min(q,qty), ratio=qty?used/qty:0;
      funded=Math.max(0,funded*(1-ratio)); qty=Math.max(0,qty-used);
    }
    lastDate=dt;
  }

  const pledge=buyDates.size*15*1.18;
  const fullyClosed=qty<=1e-8&&rows.some(t=>sideE(t)==='SELL');
  const unpledge=fullyClosed?buyDates.size*15*1.18:0;
  const total=interest+pledge+unpledge;
  const ownCapital=totalBuy*0.25, fundedInitial=totalBuy*0.75;
  return {total,interest,pledge,unpledge,ownCapital,fundedInitial,fundingPct:75,ownPct:25,dailyRatePct:0.04,buyDates:buyDates.size};
};

function verdict193(kind,value,field){

  }

    const pos=['supportive','buco>200','buco<200','above 60','60 bup','40 sup','above 0','buco>0','buco<0'];

    if(a.some(x=>x==='below 60'||x==='between 40-50'||x==='below 0'))return{label:'Caution / context',cls:'warn',score:0};

  }
  if(kind==='zone'){

    if(a.includes('extended'))return{label:'Extension risk noted',cls:'warn',score:0};
    if(a.includes('much extended from previous entry'))return{label:'Extension risk noted',cls:'warn',score:0};
    return{label:'Price-zone context recorded',cls:'neutral',score:0};
  }
  if(kind==='thesis'){
    if(/invalid|^no$/.test(v))return{label:'Thesis no longer valid',cls:'bad',score:-1};
    if(/weakening|partly/.test(v))return{label:'Thesis weakening / partial',cls:'warn',score:0};
    if(/valid|^yes$/.test(v))return{label:'Thesis valid',cls:'good',score:1};
    return{label:'Thesis context recorded',cls:'neutral',score:0};
  }
  if(kind==='trail'){

function position194(c){let qty=0,avg=0,gross=0,sells=0,fees=0;const rows=(c.transactions||[]).filter(t=>!t.deleted).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||''));for(const t of rows){const q=Math.abs(Number(t.qty)||0),p=Number(t.price)||0;if(!q||!p)continue;fees+=Math.abs(Number(t.charges)||0);if(side194(t)==='BUY'){avg=qty?((avg*qty)+(p*q))/(qty+q):p;qty+=q;}else{const used=Math.min(q,qty);gross+=(p-avg)*used;qty=Math.max(0,qty-used);sells++;if(qty<=1e-8){qty=0;avg=0;}}}const isReopened=!!state.tradeReopen1825Fixed?.[c.id],closed=!isReopened&&(c.archivedTradeId||c.forcedClosed||(c.lastExitDate&&c.outcome)||(sells>0&&qty<=1e-8));const cmp=Number(c.cmp)||0,unreal=qty>0&&cmp>0?(cmp-avg)*qty:null;return{qty,avg,cost:qty*avg,gross,sells,fees,closed,unreal};}
